<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e3350d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<title>Macera Haritası</title>
<style>
  :root { --card: #ffffff; --ink: #2b2b2b; --accent: #e3350d; --accent-dark: #a82008; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffe27a 0%, #fff7e6 220px);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 50px;
  }
  header { text-align: center; padding: 20px 16px 6px; }
  header h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 34px);
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  .nav-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .nav-row a { color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: bold; text-decoration: none; font-size: 14px; }
  .nav-back { background: #3b6cdb; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .region-banner {
    background: var(--accent); color: #fff; text-align: center; border-radius: 18px;
    padding: 14px; margin-top: 18px; font-weight: bold; font-size: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
  }

  .region-tabs { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .region-tab {
    border: none; padding: 10px 16px; border-radius: 999px; font-weight: bold; font-size: 13px; cursor: pointer;
    background: #eee; color: #888;
  }
  .region-tab.active { background: var(--accent); color: #fff; }
  .region-tab.locked { background: #f5f5f5; color: #bbb; }
  .region-locked-card {
    background: #fff; border-radius: 16px; padding: 24px 16px; margin-top: 24px; text-align: center;
    color: #a68a4a; box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }

  .path {
    position: relative; margin-top: 24px; padding-left: 34px;
  }
  .path::before {
    content: ""; position: absolute; left: 15px; top: 10px; bottom: 10px; width: 4px;
    background: #e6d9b0; border-radius: 4px;
  }

  .node {
    position: relative; margin-bottom: 18px; cursor: pointer;
  }
  .node .dot {
    position: absolute; left: -34px; top: 6px; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: #ccc; border: 3px solid #fff; box-shadow: 0 0 0 3px #e6d9b0;
  }
  .node.unlocked .dot { background: #49a84c; }
  .node.visited .dot { background: #3b6cdb; }
  .node.locked .dot { background: #bbb; }
  .node-card {
    background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .node.locked .node-card { opacity: 0.55; }
  .node-name { font-weight: bold; font-size: 16px; }
  .node-type { font-size: 12px; color: #888; text-transform: capitalize; }
  .node-tag {
    display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 999px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag-gym { background: #ffe0b3; color: #a35b00; }
  .tag-visited { background: #dff3e0; color: #237a34; }
  .tag-locked { background: #eee; color: #999; }

  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: flex-end; justify-content: center; z-index: 200;
  }
  .detail-overlay.show { display: flex; }
  .detail-box {
    background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 30px; width: 100%; max-width: 480px;
    max-height: 80vh; overflow-y: auto;
  }
  .detail-box h2 { margin: 0 0 4px; color: var(--accent-dark); }
  .detail-box .d-type { color: #888; font-size: 13px; margin-bottom: 14px; text-transform: capitalize; }
  .encounter-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .encounter-chip {
    background: #f7f7f7; border-radius: 12px; padding: 8px 12px; text-align: center; font-size: 12px; min-width: 70px;
  }
  .encounter-chip img { width: 40px; height: 40px; display: block; margin: 0 auto; }
  .encounter-chip .lv { color: #888; }
  .explore-btn {
    display: block; width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px;
    border-radius: 999px; font-size: 17px; font-weight: bold; cursor: pointer;
  }
  .explore-btn:disabled { background: #ccc; cursor: default; }
  .close-btn {
    display: block; margin: 10px auto 0; background: none; border: none; color: #888; font-size: 14px; cursor: pointer;
  }
  .coming-soon { font-size: 13px; color: #a68a4a; background: #fff7e0; border: 1px dashed #ffd27a; border-radius: 12px; padding: 10px; margin-bottom: 14px; }

  .gym-card { border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .gym-card.locked { background: #f0f0f0; }
  .gym-card.challenge { background: #fff3cd; border: 2px solid #ffd24a; }
  .gym-card.defeated { background: #dff3e0; border: 2px solid #7bc47f; }
  .gym-card .g-leader { font-weight: bold; font-size: 16px; }
  .gym-card .g-sub { font-size: 12px; color: #777; margin-bottom: 8px; }
  .gym-btn {
    display: block; width: 100%; border: none; padding: 12px; border-radius: 999px;
    font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px;
  }
  .gym-btn.challenge-btn { background: var(--accent); color: #fff; }
  .gym-btn.locked-btn { background: #ccc; color: #666; cursor: default; }
  .gym-btn.defeated-btn { background: #27ae60; color: #fff; }

  .league-card { border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .league-card.locked { background: #f0f0f0; }
  .league-card.challenge { background: #e6e0ff; border: 2px solid #8e44ad; }
  .league-card.completed { background: #fff3cd; border: 2px solid #ffd24a; }
  .league-card .l-title { font-weight: bold; font-size: 17px; }
  .league-card .l-sub { font-size: 12px; color: #777; margin-bottom: 8px; }
  .league-btn.challenge-league-btn { background: #8e44ad; color: #fff; }
  .league-btn.completed-league-btn { background: #ffb703; color: #6b3500; }

  .starter-gate-overlay {
    display: none; position: fixed; inset: 0; z-index: 500; background: linear-gradient(180deg, #ffe27a 0%, #fff7e6 100%);
    align-items: center; justify-content: center; padding: 20px;
  }
  .starter-gate-box { max-width: 420px; width: 100%; text-align: center; }
  .starter-gate-title { font-size: 24px; font-weight: bold; color: var(--accent); margin-bottom: 6px; }
  .starter-gate-sub { font-size: 14px; color: #7a6a3a; margin-bottom: 20px; }
  .starter-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .starter-card {
    background: #fff; border-radius: 18px; padding: 14px; width: 110px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.1); transition: transform 0.1s ease;
  }
  .starter-card:active { transform: scale(0.95); }
  .starter-card img { width: 80px; height: 80px; }
  .starter-name { font-weight: bold; font-size: 14px; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>🗺️ Macera Haritası</h1>
  <div class="nav-row">
    <a class="nav-back" href="adventure-hq.html">⬅️ Macera Karargâhı</a>
    <a class="nav-back" href="index.html">📖 Pokédex'e Dön</a>
  </div>
</header>

<div class="wrap">
  <div class="region-tabs" id="regionTabs"></div>
  <div class="region-banner" id="regionBanner">KANTO</div>
  <div class="path" id="pathList"></div>
</div>

<div class="starter-gate-overlay" id="starterOverlay"></div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-box" id="detailBox"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="pokedex-data.js"></script>
<script src="adventure-state.js"></script>
<script src="region-data.js"></script>
<script src="battle-engine.js"></script>
<script src="starter-data.js"></script>
<script src="gym-data.js"></script>
<script src="league-data.js"></script>
<script src="quest-data.js"></script>
<script src="adventure-achievement-data.js"></script>
<script src="adventure-events.js"></script>
<script>
const el = (id) => document.getElementById(id);
let CURRENT_REGION = "kanto";

function typeEmojiFor(type) {
  return type === "town" ? "🏠" : "🌿";
}

// Only regions that actually have map data get a tab - hoenn/sinnoh/etc.
// in REGIONS have no LOCATIONS yet, so they'd just be empty, confusing
// tabs. Whether a region CAN be selected is isRegionUnlocked
// (league-data.js, gated on Kanto Champion for Johto) - completely
// separate from a location's own `requires` chain within that region.
function renderRegionTabs() {
  const player = getAdventurePlayer();
  const regionIds = Object.keys(REGIONS).filter(id => getLocationsForRegion(id).length > 0);
  el('regionTabs').innerHTML = regionIds.map(id => {
    const unlocked = isRegionUnlocked(player, id);
    const active = id === CURRENT_REGION;
    return `<button class="region-tab ${active ? 'active' : ''} ${unlocked ? '' : 'locked'}" data-region="${id}">
      ${unlocked ? '🗺️' : '🔒'} ${REGIONS[id].name}
    </button>`;
  }).join('');
  el('regionTabs').querySelectorAll('.region-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const regionId = btn.dataset.region;
      if (!isRegionUnlocked(getAdventurePlayer(), regionId)) {
        alert(`🔒 ${REGIONS[regionId].name} henüz kilitli.`);
        return;
      }
      if (regionId === CURRENT_REGION) return;
      CURRENT_REGION = regionId;
      renderPath();
    });
  });
}

function renderPath() {
  renderRegionTabs();
  el('regionBanner').textContent = `📍 ${REGIONS[CURRENT_REGION].name.toUpperCase()}`;

  if (!isRegionUnlocked(getAdventurePlayer(), CURRENT_REGION)) {
    el('pathList').innerHTML = `<div class="region-locked-card">🔒 ${REGIONS[CURRENT_REGION].name} henüz kilitli.</div>`;
    return;
  }

  const state = getAdventureProgress();
  const locations = getLocationsForRegion(CURRENT_REGION);

  el('pathList').innerHTML = locations.map(loc => {
    const visited = state.visitedLocations.includes(loc.id);
    const unlocked = isLocationUnlocked(loc, state);
    const statusClass = visited ? 'visited' : (unlocked ? 'unlocked' : 'locked');
    const gym = loc.gymId ? getGymById(loc.gymId) : null;
    const gymDefeated = gym ? isGymDefeated(gym, getAdventurePlayer()) : false;
    const league = loc.leagueId ? getLeagueById(loc.leagueId) : null;
    const leagueCompleted = league ? isLeagueCompleted(getAdventurePlayer(), loc.leagueId) : false;
    const tag = loc.gymId
      ? `<span class="node-tag tag-gym">${gymDefeated ? '✅' : '🏟️'} Salon</span>`
      : (loc.leagueId ? `<span class="node-tag tag-gym">${leagueCompleted ? '🏆' : '⚔️'} Lig</span>` : '');
    const statusTag = visited
      ? `<span class="node-tag tag-visited">✔ Keşfedildi</span>`
      : (unlocked ? '' : `<span class="node-tag tag-locked">🔒 Kilitli</span>`);
    return `
      <div class="node ${statusClass}" data-id="${loc.id}">
        <div class="dot">${visited ? '✔' : (unlocked ? typeEmojiFor(loc.type) : '🔒')}</div>
        <div class="node-card">
          <div class="node-name">${loc.name}${tag}${statusTag}</div>
          <div class="node-type">${loc.type === 'town' ? 'Şehir' : 'Rota'}</div>
        </div>
      </div>`;
  }).join('');

  el('pathList').querySelectorAll('.node').forEach(nodeEl => {
    nodeEl.addEventListener('click', () => openDetail(nodeEl.dataset.id));
  });
}

async function openDetail(locationId) {
  const state = getAdventureProgress();
  const loc = getLocationById(locationId);
  if (!loc) return;
  const unlocked = isLocationUnlocked(loc, state);
  const visited = state.visitedLocations.includes(locationId);

  let encounterHtml = '<p style="color:#999;font-size:13px;">Bu bölgede vahşi Pokémon yok.</p>';
  if (loc.encounters.length) {
    const chips = await Promise.all(loc.encounters.map(async (enc) => {
      let name = `#${enc.speciesId}`;
      let img = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${enc.speciesId}.png`;
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${enc.speciesId}`);
        const data = await res.json();
        name = data.name;
      } catch {}
      return `<div class="encounter-chip">
        <img src="${img}" alt="${name}">
        <div>${name}</div>
        <div class="lv">Lv.${enc.minLevel}-${enc.maxLevel}</div>
      </div>`;
    }));
    encounterHtml = `<div class="encounter-list">${chips.join('')}</div>`;
  }

  let leagueHtml = '';
  if (loc.leagueId && unlocked) {
    const league = getLeagueById(loc.leagueId);
    if (league) {
      const leaguePlayer = getAdventurePlayer();
      const status = leagueStatus(league, leaguePlayer);
      const ownedBadges = leaguePlayer.badges || [];
      const badgeCount = league.requiresBadges.filter(b => ownedBadges.includes(b)).length;
      const totalBadges = league.requiresBadges.length;
      const btnHtml = status === 'locked'
        ? `<button class="gym-btn locked-btn" disabled>🔒 Kilitli — ${totalBadges} Salon Rozeti Gerekli (${badgeCount}/${totalBadges})</button>`
        : status === 'completed'
          ? `<button class="gym-btn league-btn completed-league-btn" id="leagueBtn">🏆 Tamamlandı · Tekrar Dene</button>`
          : `<button class="gym-btn league-btn challenge-league-btn" id="leagueBtn">⚔️ Lige Meydan Oku</button>`;
      const stageNames = getLeagueStages(league).map(s => s.data.name).join(' → ');
      leagueHtml = `
        <div class="league-card ${status}">
          <div class="l-title">🏟️ Pokémon Ligi</div>
          <div class="l-sub">${stageNames}</div>
          ${btnHtml}
        </div>`;
    }
  }

  let gymHtml = '';
  if (loc.gymId && unlocked) {
    const gym = getGymById(loc.gymId);
    if (gym) {
      const gymPlayer = getAdventurePlayer();
      const status = gymStatus(gym, gymPlayer);
      const btnHtml = status === 'locked'
        ? `<button class="gym-btn locked-btn" disabled>🔒 Kilitli</button>`
        : status === 'defeated'
          ? `<button class="gym-btn defeated-btn" id="gymBtn">✅ ${gym.badge.icon} ${gym.badge.name} · Tekrar Savaş</button>`
          : `<button class="gym-btn challenge-btn" id="gymBtn">⚔️ ${gym.leader}'e Meydan Oku</button>`;
      gymHtml = `
        <div class="gym-card ${status}">
          <div class="g-leader">🏟️ ${gym.leader}</div>
          <div class="g-sub">${TYPE_TR[gym.type] || gym.type} tipi · ${gym.team.length} Pokémon · ${gym.description}</div>
          ${status === 'locked' ? `<div class="g-sub">Önce önceki Salon rozetini kazanmalısın.</div>` : ''}
          ${btnHtml}
        </div>`;
    }
  }

  el('detailBox').innerHTML = `
    <h2>${loc.name}</h2>
    <div class="d-type">${loc.type === 'town' ? 'Şehir' : 'Rota'}${loc.gymId ? ' · 🏟️ Salon Şehri' : ''}</div>
    ${!unlocked ? '<p style="color:#a33;font-size:13px;">🔒 Bu bölgeye ulaşmak için önceki bölgeyi keşfetmelisin.</p>' : ''}
    ${leagueHtml}
    ${gymHtml}
    ${unlocked && loc.encounters.length ? '<div class="coming-soon">⚔️ Vahşi Pokémon savaşı ve yakalama yakında burada olacak. Şimdilik sadece bölgeyi keşfedip haritada ilerleyebilirsin.</div>' : ''}
    ${unlocked ? encounterHtml : ''}
    <button class="explore-btn" id="exploreBtn" ${!unlocked ? 'disabled' : ''}>${visited ? '✔ Tekrar Keşfet' : '🚶 Bu Bölgeyi Keşfet'}</button>
    <button class="close-btn" id="closeDetailBtn">Kapat</button>
  `;
  el('detailOverlay').classList.add('show');

  if (loc.gymId && unlocked) {
    const gymBtnEl = el('gymBtn');
    if (gymBtnEl) {
      gymBtnEl.addEventListener('click', () => {
        window.location.href = `gym-battle.html?gym=${loc.gymId}`;
      });
    }
  }
  if (loc.leagueId && unlocked) {
    const leagueBtnEl = el('leagueBtn');
    if (leagueBtnEl) {
      leagueBtnEl.addEventListener('click', () => {
        window.location.href = `league-battle.html?league=${loc.leagueId}`;
      });
    }
  }

  if (unlocked) {
    el('exploreBtn').addEventListener('click', () => {
      if (loc.encounters.length) {
        const mydex = getAdventureDex();
        const encounter = generateWildEncounter(loc, mydex);
        if (encounter) {
          window.location.href = `wild-battle.html?location=${loc.id}&species=${encounter.speciesId}&level=${encounter.level}&shiny=${encounter.shiny ? 1 : 0}`;
          return;
        }
        // Every possible encounter here is already owned (normal + shiny) - a
        // small consolation reward instead of an empty "nothing happened".
        addAdventureCoins(15);
        const visit1 = visitAdventureLocation(locationId);
        if (visit1.wasNewVisit) recordAdventureEvent('explore_location');
        closeDetail();
        renderPath();
        alert(`Bu bölgedeki tüm Pokémon türleri zaten sende! 💰 +15 PokéCoin kazandın.`);
        return;
      }
      const visit2 = visitAdventureLocation(locationId);
      if (visit2.wasNewVisit) recordAdventureEvent('explore_location');
      closeDetail();
      renderPath();
    });
  }
  el('closeDetailBtn').addEventListener('click', closeDetail);
}

function closeDetail() {
  el('detailOverlay').classList.remove('show');
}

el('detailOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'detailOverlay') closeDetail();
});

function init() {
  // Optional deep-link (e.g. Adventure HQ's "Open Map" for an unlocked
  // Johto) - ignored entirely if the region is invalid or still locked, so
  // this can never be used to bypass isRegionUnlocked.
  const requestedRegion = new URLSearchParams(window.location.search).get('region');
  if (requestedRegion && REGIONS[requestedRegion] && isRegionUnlocked(getAdventurePlayer(), requestedRegion)) {
    CURRENT_REGION = requestedRegion;
  }
  const shown = renderStarterGate(el('starterOverlay'), () => renderPath());
  if (!shown) renderPath();
}
waitForAdventureCloud().then(init);
onAdventureCloudChange(() => { if (!needsStarter()) renderPath(); });
</script>

</body>
</html>
