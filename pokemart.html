<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e3350d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<title>PokéMart</title>
<style>
  :root { --card: #ffffff; --ink: #2b2b2b; --accent: #e3350d; --accent-dark: #a82008; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffe27a 0%, #fff7e6 220px);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 50px;
  }
  header { text-align: center; padding: 20px 16px 6px; }
  header h1 {
    margin: 0; font-size: clamp(24px, 6vw, 34px); color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  .nav-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .nav-row a { color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: bold; text-decoration: none; font-size: 14px; }
  .nav-back { background: #3b6cdb; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  .coin-bar {
    position: sticky; top: 0; z-index: 20; background: #2c3e50; color: #ffd24a; text-align: center;
    font-weight: bold; font-size: 18px; padding: 12px; border-radius: 0 0 18px 18px; margin: 0 -16px 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .category-title { font-weight: bold; color: var(--accent-dark); margin: 18px 0 8px; font-size: 15px; }

  .item-card {
    display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 12px 14px;
    margin-bottom: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  }
  .item-emoji { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: bold; font-size: 15px; }
  .item-desc { font-size: 12px; color: #888; }
  .item-owned { font-size: 11px; color: #27ae60; font-weight: bold; margin-top: 2px; }
  .item-buy {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .buy-btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 999px;
    font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .buy-btn:disabled { background: #ccc; cursor: default; }
  .buy-price { font-size: 12px; color: #a68a4a; font-weight: bold; }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #27ae60; color: #fff; padding: 10px 20px; border-radius: 999px;
    font-weight: bold; font-size: 14px; z-index: 300; display: none; box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .toast.show { display: block; }
  .toast.error { background: #c0392b; }
</style>
</head>
<body>

<header>
  <h1>🛒 PokéMart</h1>
  <div class="nav-row">
    <a class="nav-back" href="adventure-hq.html">⬅️ Macera Karargâhı</a>
  </div>
</header>

<div class="wrap">
  <div class="coin-bar" id="coinBar">💰 0 PokéCoin</div>
  <div id="catalog"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="pokedex-data.js"></script>
<script src="adventure-state.js"></script>
<script src="battle-engine.js"></script>
<script src="move-data.js"></script>
<script src="item-data.js"></script>
<script>
const el = (id) => document.getElementById(id);
const CATEGORY_LABELS = { ball: '🎯 Poké Ball\'lar', healing: '💊 İyileştirme', growth: '🍬 Büyüme', evolution: '💎 Evrim' };
const CATEGORY_ORDER = ['ball', 'healing', 'growth', 'evolution'];

function showToast(text, isError) {
  const t = el('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function render() {
  const player = getAdventurePlayer();
  const inv = getAdventureInventory();
  const trainerLevel = levelInfo(player.xp).level;
  el('coinBar').textContent = `💰 ${player.coins || 0} PokéCoin`;

  el('catalog').innerHTML = CATEGORY_ORDER.map(cat => {
    const items = Object.values(ITEM_CATALOG).filter(i => i.category === cat);
    return `
      <div class="category-title">${CATEGORY_LABELS[cat]}</div>
      ${items.map(item => {
        // Phase 13: Trainer Level gate (currently only Ultra Ball) - shows
        // the requirement instead of a price/buy button until met.
        const levelLocked = item.minTrainerLevel && trainerLevel < item.minTrainerLevel;
        const buyControls = levelLocked
          ? `<div class="buy-price">🔒 Seviye ${item.minTrainerLevel} gerekli</div>`
          : `<button class="buy-btn" data-buy="${item.id}" ${(player.coins || 0) < item.price ? 'disabled' : ''}>Satın Al</button>
             <div class="buy-price">💰 ${item.price}</div>`;
        return `
        <div class="item-card">
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.description}</div>
            <div class="item-owned">Elinde: ${inv[item.id] || 0}</div>
          </div>
          <div class="item-buy">
            ${buyControls}
          </div>
        </div>`;
      }).join('')}
    `;
  }).join('');

  el('catalog').querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => handleBuy(btn.dataset.buy));
  });
}

let buyLocked = false;
function handleBuy(itemId) {
  if (buyLocked) return;
  buyLocked = true;
  const result = buyItem(itemId);
  if (result.ok) {
    showToast(`✅ ${ITEM_CATALOG[itemId].name} satın alındı!`);
  } else if (result.reason === 'insufficient-coins') {
    showToast('💸 Yetersiz PokéCoin!', true);
  } else if (result.reason === 'level-too-low') {
    showToast('🔒 Bu eşya için Eğitmen Seviyesi yetersiz.', true);
  } else {
    showToast('Satın alınamadı.', true);
  }
  render();
  buyLocked = false;
}

waitForAdventureCloud().then(render);
onAdventureCloudChange(render);
</script>

</body>
</html>
