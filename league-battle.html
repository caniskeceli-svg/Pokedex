<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8e44ad">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<title>Pokémon Ligi</title>
<style>
  :root { --card: #ffffff; --ink: #2b2b2b; --accent: #8e44ad; --accent-dark: #5e3a9c; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #e0d4f5 0%, #fff7e6 260px);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header { text-align: center; padding: 16px 16px 6px; }
  header h1 {
    margin: 0; font-size: clamp(20px, 5.5vw, 28px); color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .card { background: #fff; border-radius: 20px; padding: 16px; margin-top: 14px; box-shadow: 0 6px 0 rgba(0,0,0,0.08); }

  .leader-banner {
    background: #2c3e50; color: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; text-align: center;
  }
  .leader-name { font-size: 18px; font-weight: bold; }
  .leader-sub { font-size: 12px; color: #d9b8ff; }
  .team-progress { font-size: 12px; color: #bbb; margin-top: 4px; }
  .gauntlet-track { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .gauntlet-step { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #445566; color: #bbb; }
  .gauntlet-step.done { background: #27ae60; color: #fff; }
  .gauntlet-step.current { background: #ffd24a; color: #2c3e50; font-weight: bold; }

  .team-preview { background: #fdf7ff; border: 1px dashed #d9b8ff; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  .team-preview .tp-title { font-weight: bold; color: #6b4a8a; font-size: 13px; margin-bottom: 6px; text-align: center; }
  .team-preview .tp-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .team-preview .tp-item { background: #fff; border-radius: 12px; padding: 8px; text-align: center; width: 88px; }
  .team-preview .tp-item img { width: 48px; height: 48px; }
  .team-preview .tp-name { font-weight: bold; font-size: 12px; text-transform: capitalize; }
  .team-preview .tp-lv { font-size: 11px; color: #888; }
  .team-preview .type-chip { display: inline-block; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 999px; margin-top: 2px; }
  .team-preview .tp-hint { font-size: 9px; color: #888; margin-top: 3px; line-height: 1.3; }

  .pick-item { display: flex; align-items: center; gap: 10px; background: #f7f7f7; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .pick-item.disabled { opacity: 0.4; cursor: default; }
  .pick-item:hover:not(.disabled) { background: #f0e6ff; }
  .pick-item img { width: 44px; height: 44px; }
  .pick-item .p-name { font-weight: bold; text-transform: capitalize; }
  .pick-item .p-sub { font-size: 12px; color: #888; }
  .pick-item.sw-good { border-left: 5px solid #3aa13a; background: #eefbee; }
  .pick-item.sw-bad { border-left: 5px solid #d1443f; background: #fdeceb; }
  .pick-item.sw-neutral { border-left: 5px solid #ccc; }
  .pick-item.sw-good:hover:not(.disabled) { background: #e0f6e0; }
  .pick-item.sw-bad:hover:not(.disabled) { background: #fbdedb; }

  .vs-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mon-box { text-align: center; flex: 1; }
  .mon-box img { width: 90px; height: 90px; }
  .mon-name { font-weight: bold; text-transform: capitalize; font-size: 15px; }
  .mon-lv { font-size: 12px; color: #888; }
  .hp-track { background: #eee; border-radius: 999px; height: 10px; overflow: hidden; margin-top: 4px; }
  .hp-fill { height: 100%; background: linear-gradient(90deg,#49a84c,#8bd98e); transition: width 0.3s ease; }
  .hp-fill.low { background: linear-gradient(90deg,#e3350d,#ff8a65); }
  .status-badge { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: bold; background: #fff3cd; border: 1px solid #ffd24a; border-radius: 999px; padding: 2px 8px; }
  .vs-text { font-weight: bold; font-size: 20px; color: var(--accent); }

  .log-box { background: #fdf7ff; border: 2px dashed #d9b8ff; border-radius: 14px; padding: 10px 12px; font-size: 13px; margin-top: 12px; min-height: 40px; }

  .move-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .move-btn {
    background: #3b6cdb; color: #fff; border: none; padding: 12px; border-radius: 12px;
    font-size: 14px; font-weight: bold; cursor: pointer; text-transform: capitalize;
  }
  .move-btn:disabled { background: #ccc; cursor: default; }
  .move-mult { display: inline-block; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 999px; }
  .move-mult.mult-good { background: #d4f5d4; color: #1a7a1a; }
  .move-mult.mult-bad { background: #ffd9d9; color: #a3221f; }
  .move-mult.mult-zero { background: #eee; color: #888; }
  .move-mult.mult-neutral { background: #eee; color: #666; }

  .item-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .item-btn {
    flex: 1; min-width: 90px; background: #27ae60; color: #fff; border: none; padding: 10px; border-radius: 12px;
    font-size: 13px; font-weight: bold; cursor: pointer;
  }
  .item-btn:disabled { background: #ccc; cursor: default; }
  .run-btn { display: block; width: 100%; margin-top: 10px; background: none; border: 2px solid #ccc; color: #888; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; }
  .switch-btn { display: block; width: 100%; margin-top: 10px; background: #8e44ad; color: #fff; border: none; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; }

  .switch-item { display: flex; align-items: center; gap: 10px; background: #f7f7f7; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .switch-item.disabled { opacity: 0.4; cursor: default; }
  .switch-item.active { border: 2px solid #8e44ad; }
  .switch-item:hover:not(.disabled) { background: #f0e6ff; }
  .switch-item img { width: 44px; height: 44px; }
  .switch-item .s-name { font-weight: bold; text-transform: capitalize; }
  .switch-item .s-hp { font-size: 12px; color: #888; }
  .switch-item .hp-track { width: 100px; }
  .switch-item.sw-good { border-left: 5px solid #3aa13a; background: #eefbee; }
  .switch-item.sw-bad { border-left: 5px solid #d1443f; background: #fdeceb; }
  .switch-item.sw-neutral { border-left: 5px solid #ccc; }
  .switch-item.sw-good:hover:not(.disabled) { background: #e0f6e0; }
  .switch-item.sw-bad:hover:not(.disabled) { background: #fbdedb; }
  .sw-note { font-size: 11px; margin-top: 3px; font-weight: bold; }
  .sw-note-good { color: #1a7a1a; }
  .sw-note-bad { color: #a3221f; }
  .sw-note-neutral { color: #888; }
  .switch-item.revivable { opacity: 1; cursor: default; }
  .revive-btn { margin-top: 5px; background: #8e44ad; color: #fff; border: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .result-title { font-size: 22px; font-weight: bold; text-align: center; color: var(--accent-dark); }
  .reward-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 12px 0; font-size: 14px; }
  .reward-chip { background: #f0f8f0; border-radius: 999px; padding: 6px 14px; font-weight: bold; }
  .badge-chip { background: #fff3cd; border: 2px solid #ffd24a; }
  .continue-btn {
    display: block; width: 100%; background: #27ae60; color: #fff; border: none; padding: 14px;
    border-radius: 999px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .locked-msg { text-align: center; color: #a33; font-size: 14px; }
  .levelup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center;
    justify-content: center; z-index: 9999; padding: 20px; animation: levelupFadeIn 0.2s ease-out;
  }
  .levelup-card {
    background: #fff; border-radius: 20px; padding: 24px; text-align: center; max-width: 260px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.15); animation: levelupPopIn 0.35s ease-out;
  }
  .levelup-stars { font-size: 20px; margin-bottom: 4px; animation: levelupTwinkle 1.2s ease-in-out infinite; }
  .levelup-card img { width: 96px; height: 96px; }
  .levelup-name { font-weight: bold; font-size: 16px; text-transform: capitalize; margin-top: 6px; }
  .levelup-level { color: #5a2d82; font-weight: bold; font-size: 18px; margin-top: 4px; }
  @keyframes levelupFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes levelupPopIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes levelupTwinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<header><h1>🏟️ Pokémon Ligi</h1></header>

<div class="wrap" id="wrap"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="pokedex-data.js"></script>
<script src="adventure-state.js"></script>
<script src="region-data.js"></script>
<script src="battle-engine.js"></script>
<script src="move-data.js"></script>
<script src="item-data.js"></script>
<script src="gym-data.js"></script>
<script src="league-data.js"></script>
<script src="quest-data.js"></script>
<script src="adventure-achievement-data.js"></script>
<script src="adventure-events.js"></script>
<script>
const el = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search);
const leagueId = params.get('league');
const league = getLeagueById(leagueId);
const stages = league ? getLeagueStages(league) : [];

let stageIdx = 0;      // index into `stages` for the gauntlet member currently being fought
let enemyIndex = 0;    // index into the current stage's own team[]
let enemy = null;
let player = null; // always battleParty[activeIndex]
let battleParty = []; // every non-fainted party member available for this run, rebuilt on start/resume
let activeIndex = -1;
// Every Pokemon that was ever active against the CURRENT stage - all of
// them get that stage's XP, not just whoever's active when it falls.
// Reset each time a stage is (re)loaded, same as battleParty itself.
let foughtInstanceIds = new Set();
let battleEnded = false;
let logLines = [];

function log(msg) {
  logLines.unshift(msg);
  logLines = logLines.slice(0, 4);
}

function spriteFor(speciesId) {
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${speciesId}.png`;
}

// A small, self-dismissing toast for a level-up - deliberately modest
// (one card, a couple of sparkles, no fireworks) since it can fire right
// as the victory screen renders. Tap or ~2.5s dismisses it.
// Multiple Pokemon can level up from the same win (everyone who fought
// gets XP) - queue the toasts one at a time instead of stacking several
// identical overlays on top of each other, which used to hide all but
// the last one shown.
let levelUpQueue = [];
let levelUpActive = false;
function showLevelUpCard(mon, oldLevel, newLevel) {
  levelUpQueue.push({ mon, oldLevel, newLevel });
  if (!levelUpActive) advanceLevelUpQueue();
}
function advanceLevelUpQueue() {
  const next = levelUpQueue.shift();
  if (!next) { levelUpActive = false; return; }
  levelUpActive = true;
  const { mon, oldLevel, newLevel } = next;
  const overlay = document.createElement('div');
  overlay.className = 'levelup-overlay';
  overlay.innerHTML = `
    <div class="levelup-card">
      <div class="levelup-stars">✨ ⭐ ✨</div>
      <img src="${spriteFor(mon.id)}" alt="${mon.name}">
      <div class="levelup-name">${mon.nickname || mon.name}</div>
      <div class="levelup-level">Lv.${oldLevel} → Lv.${newLevel}</div>
    </div>`;
  document.body.appendChild(overlay);
  const dismiss = () => { overlay.remove(); advanceLevelUpQueue(); };
  overlay.addEventListener('click', dismiss);
  setTimeout(dismiss, 2500);
}

// Grants the active Pokemon XP for a first-time Elite Four/Champion
// victory - mirrors wild-battle.html's awardBattleXp, scaled from the
// same trainerXp reward the league already defines.
// Awards pokemonXp to EVERY Pokemon that fought this stage
// (foughtInstanceIds), not just whoever's active when it falls - each
// gets the full amount, not a split share.
function awardPokemonBattleXp(pokemonXp) {
  const mydex = getAdventureDex();
  foughtInstanceIds.forEach(instanceId => {
    const idx = mydex.findIndex(p => p.instanceId === instanceId);
    if (idx === -1) return;
    const mon = mydex[idx];
    const oldLevel = mon.level || 1;
    const gainedPxp = (mon.pxp || 0) + pokemonXp;
    // A wild catch starts a Pokemon at its caught level with pxp:0 (not
    // the pxp that level would otherwise take to reach), so level must
    // never be allowed to DROP to whatever pxp alone implies - only ever
    // rise. Bumping pxp itself up to match keeps the two consistent - see
    // wild-battle.html's identical fix for the full reasoning.
    const level = Math.max(oldLevel, pokemonLevelInfo(gainedPxp).level);
    const newPxp = Math.max(gainedPxp, (level - 1) * POKEMON_XP_PER_LEVEL);
    const learnResult = checkLevelUpLearn(mon, oldLevel, level);
    const leveled = Object.assign({}, mon, { pxp: newPxp, level });
    mydex[idx] = applyLevelUpLearn(leveled, learnResult);
    if (level > oldLevel) showLevelUpCard(mon, oldLevel, level);
  });
  saveAdventureDex(mydex);
}

function hpBarClass(hp, maxHp) {
  return (hp / maxHp) < 0.25 ? 'hp-fill low' : 'hp-fill';
}

function gauntletTrackHtml() {
  return `<div class="gauntlet-track">${stages.map((s, i) => {
    const cls = i < stageIdx ? 'done' : (i === stageIdx ? 'current' : '');
    return `<span class="gauntlet-step ${cls}">${s.data.name.split(' ')[0]}</span>`;
  }).join('')}</div>`;
}

// Fetches the very first opponent's (stages[0]) team names/types up front
// so the player can see who they're about to face before picking their own
// Pokémon - shows a retry screen instead of leaving the picker stuck if the
// fetches fail or time out. Only the first stage is previewed: the rest of
// the gauntlet reveals itself as the player advances, same pacing as before.
async function loadTeamPreviewAndRender() {
  el('wrap').innerHTML = '<div class="card"><p style="text-align:center;color:#999;">Yükleniyor...</p></div>';
  try {
    const firstStage = stages[0];
    const teamInfo = await Promise.all(firstStage.data.team.map(async (m) => {
      const species = await fetchPokemonSpeciesData(m.speciesId);
      return { speciesId: m.speciesId, name: species.name, types: species.types, level: m.level };
    }));
    renderPartyPicker(firstStage, teamInfo);
  } catch (e) {
    console.error(e);
    el('wrap').innerHTML = `<div class="card"><p style="text-align:center;color:#a33;">Takım bilgisi yüklenemedi 😕 İnternetini kontrol et.</p><button class="continue-btn" id="retryTeamBtn">🔄 Tekrar Dene</button></div>`;
    el('retryTeamBtn').addEventListener('click', loadTeamPreviewAndRender);
  }
}

function typeChip(t) {
  return `<span class="type-chip" style="background:${TYPE_COLORS[t] || '#888'}">${TYPE_TR[t] || t}</span>`;
}

// Switch-picker recommendation: how would this candidate's types fare
// against the current enemy - both offense (best multiplier this Pokemon's
// types have attacking the enemy) and defense (worst-case multiplier the
// enemy's types have attacking this Pokemon). Pure TYPE_CHART lookups via
// typeMultiplier, no new type data.
function fmtMult(m) {
  return (Number.isInteger(m) ? m : m).toString() + '×';
}
// offenseTypes is normally the mon's actual known move types (knownMoveTypes
// in move-data.js) - falls back to its own species types only if that list
// is somehow empty, so the "vurur" number here matches what a move button
// in battle would actually show instead of an unlearned-move best case.
function switchAdvice(types, enemyTypes, offenseTypes) {
  const attackTypes = (offenseTypes && offenseTypes.length) ? offenseTypes : types;
  const offense = Math.max(...attackTypes.map(t => typeMultiplier(t, enemyTypes)));
  const defense = Math.max(...enemyTypes.map(t => typeMultiplier(t, types)));
  let verdict;
  if (defense === 0) verdict = 'good';
  else if (offense === 0) verdict = 'bad';
  else if (defense > offense) verdict = 'bad';
  else if (offense > defense) verdict = 'good';
  else verdict = 'neutral';
  return { verdict, note: `${fmtMult(defense)} yer, ${fmtMult(offense)} vurur` };
}

// Compact weak/resist hint for the small team-preview cards - same
// weak-against/resisted-by math as wild-battle.html's typeHintHtml, just
// rendered small enough to fit an 88px-wide card instead of its own box.
function miniTypeHint(types) {
  const allTypes = Object.keys(TYPE_CHART);
  const strongAgainst = allTypes.filter(t => typeMultiplier(t, types) > 1);
  const resistedBy = allTypes.filter(t => typeMultiplier(t, types) < 1);
  return `
    ${strongAgainst.length ? `<div class="tp-hint">⚡ ${strongAgainst.map(t => TYPE_TR[t] || t).join(', ')}</div>` : ''}
    ${resistedBy.length ? `<div class="tp-hint">🛡️ ${resistedBy.map(t => TYPE_TR[t] || t).join(', ')}</div>` : ''}`;
}

function teamPreviewHtml(stageName, teamInfo) {
  return `
    <div class="team-preview">
      <div class="tp-title">👥 ${stageName}'in Takımı</div>
      <div class="tp-list">
        ${teamInfo.map(m => `
          <div class="tp-item">
            <img src="${spriteFor(m.speciesId)}" alt="${m.name}">
            <div class="tp-name">${m.name}</div>
            <div class="tp-lv">Lv.${m.level}</div>
            <div>${m.types.map(typeChip).join(' ')}</div>
            ${miniTypeHint(m.types)}
          </div>`).join('')}
      </div>
    </div>`;
}

function renderPartyPicker(firstStage, teamInfo) {
  const mydex = getAdventureDex().filter(p => p.id < 900000000);
  const wrap = el('wrap');
  wrap.innerHTML = `
    <div class="card">
      <div class="leader-banner">
        <div class="leader-name">🏟️ Pokémon Ligi</div>
        <div class="leader-sub">Elit Dörtlü + Şampiyon</div>
        ${gauntletTrackHtml()}
      </div>
      ${firstStage ? teamPreviewHtml(firstStage.data.name, teamInfo) : ''}
      <div style="text-align:center;font-weight:bold;margin-bottom:8px;">Hangi Pokémon'unla Lige gireceksin?</div>
      <p style="text-align:center;color:#888;font-size:12px;">Bu Pokémon tüm mücadele boyunca (Elit Dörtlü + Şampiyon) aynı HP ile devam edecek.</p>
      <div id="pickList"></div>
    </div>`;
  const pickList = el('pickList');
  if (!mydex.length) {
    pickList.innerHTML = '<p style="text-align:center;color:#999;">Henüz hiç Adventure Pokémon\'un yok. <a href="adventure-hq.html">Macera Karargâhı\'na dön</a>.</p>';
    return;
  }
  const firstEnemyTypes = (teamInfo && teamInfo[0] && teamInfo[0].types) || [];
  pickList.innerHTML = mydex.map(p => {
    const fainted = p.fainted === true;
    const advice = (!fainted && p.types && firstEnemyTypes.length) ? switchAdvice(p.types, firstEnemyTypes, knownMoveTypes(p)) : null;
    return `
      <div class="pick-item ${fainted ? 'disabled' : ''} ${advice ? 'sw-' + advice.verdict : ''}" data-instance="${p.instanceId || ''}">
        <img src="${p.img}" alt="${p.name}">
        <div>
          <div class="p-name">${p.nickname || p.name}${p.shiny ? ' ✨' : ''}</div>
          <div class="p-sub">Lv.${p.level || 1}${fainted ? ' · 😵 Baygın' : ''}</div>
          <div>${(p.types || []).map(typeChip).join(' ')}</div>
          ${advice ? `<div class="sw-note sw-note-${advice.verdict}">${advice.verdict === 'good' ? '✓' : advice.verdict === 'bad' ? '⚠️' : '➖'} ${advice.note} (ilk rakip)</div>` : ''}
        </div>
      </div>`;
  }).join('');
  pickList.querySelectorAll('.pick-item:not(.disabled)').forEach(itemEl => {
    itemEl.addEventListener('click', () => {
      const mon = mydex.find(p => p.instanceId === itemEl.dataset.instance);
      const attempt = beginLeagueAttempt(leagueId, mon.instanceId);
      stageIdx = 0;
      startStageFromAttempt(attempt, mon);
    });
  });
  if (mydex.every(p => p.fainted === true)) {
    pickList.insertAdjacentHTML('beforeend', '<p style="text-align:center;color:#a33;font-size:13px;margin-top:8px;">Tüm Pokémon\'ların baygın! Şimdilik Lige giremezsin. 🏥</p>');
  }
}

// Phase 15: builds the battle-ready shape for one party member (same shape
// startStageFromAttempt always built for the single chosen mon) - idempotent
// moves migration included, same as before. Used for every non-fainted
// party member up front so any of them can be switched in later mid-run.
function buildBattlePartyMember(mon) {
  const ensuredMon = ensureInstanceMoves(mon);
  if (ensuredMon !== mon) {
    const mydex0 = getAdventureDex();
    const idx0 = mydex0.findIndex(p => p.instanceId === mon.instanceId);
    if (idx0 !== -1) { mydex0[idx0] = ensuredMon; saveAdventureDex(mydex0); }
  }
  const pStats = computeBattleStats(ensuredMon.stats || {}, ensuredMon.level || 1);
  return {
    instanceId: ensuredMon.instanceId,
    id: ensuredMon.id,
    name: ensuredMon.nickname || ensuredMon.name,
    types: ensuredMon.types,
    level: ensuredMon.level || 1,
    maxHp: pStats.maxHp,
    hp: computeMonCurrentHp(ensuredMon),
    battleStats: pStats,
    // PP persists across League stages exactly like HP (Phase 11) - hydrated
    // fresh from the instance's own stored moves on every stage load/resume,
    // so a used move stays used until a Pokemon Center visit.
    moves: hydrateBattleMoves(ensuredMon),
    // Status persists across League stages exactly like HP/PP (Phase 12).
    status: ensuredMon.status || null
  };
}

async function startStageFromAttempt(attempt, playerMon) {
  stageIdx = Math.max(0, stages.findIndex(s => s.stageId === attempt.stage));
  // Phase 15: the whole non-fainted party enters the run available to
  // switch into, not just the chosen/resumed starter - rebuilt fresh from
  // mydex on both a brand new attempt and a page-reload resume, since
  // mydex already holds the true persisted state for every member.
  const eligible = getAdventureDex().filter(p => p.id < 900000000 && p.fainted !== true);
  battleParty = eligible.map(buildBattlePartyMember);
  activeIndex = battleParty.findIndex(m => m.instanceId === playerMon.instanceId);
  player = battleParty[activeIndex];
  foughtInstanceIds = new Set([player.instanceId]);
  enemyIndex = 0;
  logLines = [];
  const stage = stages[stageIdx];
  log(`${stage.data.name} seni bekliyor!`);
  await loadEnemyAndRender();
}

// Wraps loadCurrentEnemy() with a visible loading state and, if the PokeAPI
// fetch fails or times out (fetchWithTimeout), a "yüklenemedi, tekrar dene"
// screen instead of leaving the page stuck on "Yükleniyor..." forever with
// no way forward.
async function loadEnemyAndRender() {
  el('wrap').innerHTML = '<div class="card"><p style="text-align:center;color:#999;">Yükleniyor...</p></div>';
  try {
    await loadCurrentEnemy();
    renderBattle();
  } catch (e) {
    console.error(e);
    el('wrap').innerHTML = `<div class="card"><p style="text-align:center;color:#a33;">Pokémon yüklenemedi 😕 İnternetini kontrol et.</p><button class="continue-btn" id="retryLoadBtn">🔄 Tekrar Dene</button></div>`;
    el('retryLoadBtn').addEventListener('click', loadEnemyAndRender);
  }
}

async function resumeAttempt(attempt) {
  const mydex = getAdventureDex();
  const mon = mydex.find(p => p.instanceId === attempt.instanceId);
  if (!mon || mon.fainted) {
    // The chosen Pokemon fainted or vanished since the last session - the
    // attempt can't safely continue (no Adventure Team to swap in), so end
    // it cleanly and send the player back to a fresh pick.
    endLeagueAttempt(leagueId);
    loadTeamPreviewAndRender();
    return;
  }
  await startStageFromAttempt(attempt, mon);
}

async function loadCurrentEnemy() {
  const stage = stages[stageIdx];
  const teamMon = stage.data.team[enemyIndex];
  const speciesData = await fetchPokemonSpeciesData(teamMon.speciesId);
  const stats = computeBattleStats(speciesData.stats, teamMon.level);
  enemy = {
    id: speciesData.id,
    name: speciesData.name,
    types: speciesData.types,
    level: teamMon.level,
    maxHp: stats.maxHp,
    hp: stats.maxHp,
    battleStats: stats,
    moves: freshBattleMoves(speciesData.id, teamMon.level, speciesData.types),
    status: null, // an Elite Four/Champion Pokemon's own status is never persisted, only lasts this one fight
    sprite: spriteFor(speciesData.id)
  };
  log(`${stage.data.name}, ${enemy.name}'i gönderdi!`);
}

// Phase 12: tiny display map for the 3 in-scope statuses - each battle page
// keeps its own copy (same "no shared renderer" split as Phase 11), the
// actual status VALUES always come from battle-engine.js.
const STATUS_LABEL = { burn: '🔥 Yanık', poison: '☠️ Zehir', paralysis: '⚡ Felç' };
function statusBadge(status) {
  return status && STATUS_LABEL[status] ? `<div class="status-badge">${STATUS_LABEL[status]}</div>` : '';
}

function renderBattle() {
  const stage = stages[stageIdx];
  const wrap = el('wrap');
  const inv = getAdventureInventory();
  wrap.innerHTML = `
    <div class="card">
      <div class="leader-banner">
        <div class="leader-name">${stage.data.name}</div>
        <div class="team-progress">Pokémon ${enemyIndex + 1} / ${stage.data.team.length}</div>
        ${gauntletTrackHtml()}
      </div>
      <div class="vs-row">
        <div class="mon-box">
          <img src="${enemy.sprite}" alt="${enemy.name}">
          <div class="mon-name">${enemy.name}</div>
          <div class="mon-lv">Lv.${enemy.level}</div>
          <div class="hp-track"><div class="${hpBarClass(enemy.hp, enemy.maxHp)}" style="width:${Math.max(0, enemy.hp / enemy.maxHp * 100)}%"></div></div>
          ${statusBadge(enemy.status)}
        </div>
        <div class="vs-text">VS</div>
        <div class="mon-box">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${player.id}.png" alt="${player.name}">
          <div class="mon-name">${player.name}</div>
          <div class="mon-lv">Lv.${player.level}</div>
          <div class="hp-track"><div class="${hpBarClass(player.hp, player.maxHp)}" style="width:${Math.max(0, player.hp / player.maxHp * 100)}%"></div></div>
          ${statusBadge(player.status)}
        </div>
      </div>

      <div class="log-box">${logLines.map(l => `<div>${l}</div>`).join('')}</div>

      <div class="move-grid" id="moveGrid">
        ${player.moves.map((m, i) => {
          const mult = typeMultiplier(m.type, enemy.types);
          const multClass = mult === 0 ? 'mult-zero' : mult > 1 ? 'mult-good' : mult < 1 ? 'mult-bad' : 'mult-neutral';
          return `<button class="move-btn" data-move="${i}" ${m.pp <= 0 ? 'disabled' : ''}>${m.name} ${typeChip(m.type)} <span class="move-mult ${multClass}">${fmtMult(mult)}</span><br><span style="font-weight:normal;font-size:11px;">${m.pp}/${m.maxPp} PP</span></button>`;
        }).join('')}
      </div>

      <div class="item-row" id="itemRow">
        ${['potion', 'super-potion', 'berry'].map(key => `
          <button class="item-btn" data-heal="${key}" ${(inv[key] || 0) <= 0 || player.hp >= player.maxHp ? 'disabled' : ''}>
            ${ITEM_CATALOG[key].emoji} ${ITEM_CATALOG[key].name} (${inv[key] || 0})
          </button>`).join('')}
      </div>
      ${battleParty.some((m, i) => i !== activeIndex && (m.hp > 0 || ((inv.revive || 0) > 0 && m.hp <= 0))) ? '<button class="switch-btn" id="switchBtn">🔄 Değiştir</button>' : ''}
      <button class="run-btn" id="runBtn">🏳️ Vazgeç</button>
    </div>`;

  el('moveGrid').querySelectorAll('.move-btn').forEach(btn => {
    btn.addEventListener('click', () => useMove(Number(btn.dataset.move)));
  });
  el('itemRow').querySelectorAll('.item-btn').forEach(btn => {
    btn.addEventListener('click', () => useHealItemInBattle(btn.dataset.heal));
  });
  const switchBtn = el('switchBtn');
  if (switchBtn) switchBtn.addEventListener('click', () => renderSwitchPicker(false));
  el('runBtn').addEventListener('click', giveUp);
}

function persistPlayerHp() {
  const mydex = getAdventureDex();
  const idx = mydex.findIndex(p => p.instanceId === player.instanceId);
  if (idx === -1) return;
  // PP and status persist exactly like HP (Phase 11/12), including across
  // League stages - never reset between stages, never on loss/quit (see
  // endLeagueAttempt), only by a Pokemon Center visit.
  mydex[idx] = Object.assign({}, mydex[idx], { currentHp: player.hp, fainted: player.hp <= 0, moves: serializeBattleMoves(player.moves), status: player.status || null });
  saveAdventureDex(mydex);
}

// Phase 15: mid-battle switching, identical rules to wild/gym battle - the
// current gauntlet member keeps fighting the switched-in mon exactly as it
// would have fought whoever was active before. Also updates the saved
// attempt's own instanceId so a resume-after-refresh reloads whichever
// Pokemon was actually last active, not just the one the run started with.
function renderSwitchPicker(forced) {
  const wrap = el('wrap');
  const inv = getAdventureInventory();
  wrap.innerHTML = `
    <div class="card">
      <div style="text-align:center;font-weight:bold;margin-bottom:8px;">${forced ? `<span style="text-transform:capitalize;">${player.name}</span> baygın düştü! Sırada kim var?` : 'Hangi Pokémon\'unla devam etmek istersin?'}</div>
      <div id="switchList"></div>
      ${forced ? '' : '<button class="run-btn" id="switchCancelBtn">◀ Vazgeç</button>'}
    </div>`;
  el('switchList').innerHTML = battleParty.map((m, i) => {
    const fainted = m.hp <= 0;
    const disabled = i === activeIndex || fainted;
    const advice = (!disabled && m.types) ? switchAdvice(m.types, enemy.types, knownMoveTypes(m)) : null;
    const canRevive = fainted && (inv.revive || 0) > 0;
    return `
      <div class="switch-item ${disabled ? 'disabled' : ''} ${canRevive ? 'revivable' : ''} ${i === activeIndex ? 'active' : ''} ${advice ? 'sw-' + advice.verdict : ''}" data-idx="${i}">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${m.id}.png" alt="${m.name}">
        <div style="flex:1;">
          <div class="s-name">${m.name}${i === activeIndex ? ' (aktif)' : ''}</div>
          <div class="hp-track"><div class="${hpBarClass(m.hp, m.maxHp)}" style="width:${Math.max(0, m.hp / m.maxHp * 100)}%"></div></div>
          <div class="s-hp">${m.hp}/${m.maxHp} HP · Lv.${m.level}${fainted ? ' · 😵 Baygın' : ''}</div>
          <div>${(m.types || []).map(typeChip).join(' ')}</div>
          ${advice ? `<div class="sw-note sw-note-${advice.verdict}">${advice.verdict === 'good' ? '✓' : advice.verdict === 'bad' ? '⚠️' : '➖'} ${advice.note}</div>` : ''}
          ${canRevive ? `<button class="revive-btn" data-revive-idx="${i}">✨ Canlandırıcı Kullan (${inv.revive})</button>` : ''}
        </div>
      </div>`;
  }).join('');
  el('switchList').querySelectorAll('.switch-item:not(.disabled)').forEach(itemEl => {
    itemEl.addEventListener('click', () => confirmSwitch(Number(itemEl.dataset.idx), forced));
  });
  el('switchList').querySelectorAll('.revive-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      useReviveInBattle(Number(btn.dataset.reviveIdx), forced);
    });
  });
  if (!forced) {
    el('switchCancelBtn').addEventListener('click', renderBattle);
  }
}

// Revives a fainted battleParty member right from the switch screen instead
// of forcing a run back to the Pokemon Center - same 50%-HP effect as
// applyRevive (item-data.js), just applied to the in-memory battle copy
// (and immediately persisted) instead of the resting dex.
function useReviveInBattle(idx, forced) {
  const inv = getAdventureInventory();
  if ((inv.revive || 0) <= 0) return;
  const mon = battleParty[idx];
  if (!mon || mon.hp > 0) return;
  addAdventureItems('revive', -1);
  mon.hp = Math.max(1, Math.round(mon.maxHp * (ITEM_CATALOG.revive.effect.hpFraction || 0.5)));
  const mydex = getAdventureDex();
  const dexIdx = mydex.findIndex(p => p.instanceId === mon.instanceId);
  if (dexIdx !== -1) {
    mydex[dexIdx] = Object.assign({}, mydex[dexIdx], { currentHp: mon.hp, fainted: false });
    saveAdventureDex(mydex);
  }
  log(`${mon.name} Canlandırıcı ile geri geldi!`);
  renderSwitchPicker(forced);
}

function confirmSwitch(idx, forced) {
  activeIndex = idx;
  player = battleParty[idx];
  foughtInstanceIds.add(player.instanceId);
  updateLeagueAttemptInstance(leagueId, player.instanceId);
  if (forced) {
    log(`Hadi ${player.name}!`);
    renderBattle();
    return;
  }
  log(`Dön! Hadi ${player.name}!`);
  const steps = resolveSwitchTurn({ player, enemy });
  steps.forEach(s => log(formatMoveLogLine(s, s.side === 'player' ? player.name : enemy.name)));
  persistPlayerHp();
  if (handleFaintCheck()) return;
  renderBattle();
}

// See wild-battle.html's identical helper for the full rationale: a team
// wipe (no other non-fainted party member left) still ends the run in a
// loss exactly as before, otherwise the player is walked into a forced
// switch instead of the whole League attempt ending on one fainted Pokemon.
function handleFaintCheck() {
  if (player.hp > 0) return false;
  const nextIdx = battleParty.findIndex((m, i) => i !== activeIndex && m.hp > 0);
  const inv = getAdventureInventory();
  const canRevive = (inv.revive || 0) > 0 && battleParty.some((m, i) => i !== activeIndex && m.hp <= 0);
  if (nextIdx === -1 && !canRevive) { endBattle('loss'); return true; }
  renderSwitchPicker(true);
  return true;
}

// One enemy counter-move outside the normal move-vs-move turn (used after
// an item, which already costs the player's own turn) - still goes through
// the same AI pick + accuracy/damage/status resolution as a real turn
// (including the Elite Four/Champion Pokemon's own paralysis check).
function enemyCounterAttack() {
  if (enemy.status === 'paralysis' && rollParalysisPrevented()) {
    log(`${enemy.name} felç oldu! Hareket edemedi.`);
    return;
  }
  const move = chooseEnemyMove(enemy.moves, player.types);
  if (move.pp > 0) move.pp -= 1;
  const r = resolveMoveUse({ move, attackerTypes: enemy.types, attackerStats: enemy.battleStats, defenderTypes: player.types, defenderStats: player.battleStats, defenderStatus: player.status });
  if (r.hit) {
    player.hp = Math.max(0, player.hp - r.damage);
    if (r.appliedStatus) player.status = r.appliedStatus;
    log(`${enemy.name}, ${move.name} kullandı! ${r.damage} hasar.${r.appliedStatus ? ` ${player.name} ${STATUS_LABEL[r.appliedStatus]} oldu!` : ''}`);
  } else {
    log(`${enemy.name}, ${move.name} kullandı! Isabet etmedi.`);
  }
  persistPlayerHp();
}

function formatMoveLogLine(step, actorName) {
  if (step.kind === 'status-damage') {
    return `${actorName}, ${STATUS_LABEL[step.status]} nedeniyle ${step.damage} hasar aldı!${step.targetFaintedByThis ? ' Bayıldı!' : ''}`;
  }
  if (step.prevented) return `${actorName} felç oldu! Hareket edemedi.`;
  if (!step.hit) return `${actorName}, ${step.move.name} kullandı! Isabet etmedi.`;
  const effText = step.effectiveness > 1 ? ' (Etkili! 💥)' : (step.effectiveness < 1 && step.effectiveness > 0) ? ' (Etkisiz...)' : step.effectiveness === 0 ? ' (Etkisiz!)' : '';
  const statusText = step.appliedStatus ? ` ${STATUS_LABEL[step.appliedStatus]} oldu!` : '';
  return `${actorName}, ${step.move.name} kullandı! ${step.damage} hasar${effText}${step.isCrit ? ' Kritik vuruş!' : ''}${statusText}`;
}

async function useMove(moveIndex) {
  if (battleEnded) return;
  const stage = stages[stageIdx];
  const move = player.moves[moveIndex];
  if (move.pp <= 0) return;
  const steps = resolveBattleTurn({ player, playerMoveIndex: moveIndex, enemy });
  steps.forEach(s => log(formatMoveLogLine(s, s.side === 'player' ? player.name : enemy.name)));

  if (enemy.hp <= 0) {
    log(`${enemy.name} bayıldı!`);
    persistPlayerHp();
    enemyIndex++;
    if (enemyIndex >= stage.data.team.length) {
      onStageCleared();
      return;
    }
    await loadEnemyAndRender();
    return;
  }

  persistPlayerHp();
  if (handleFaintCheck()) return;
  renderBattle();
}

function useHealItemInBattle(itemKey) {
  if (battleEnded) return;
  const result = applyHealItem(player.instanceId, itemKey);
  if (!result.ok) return;
  player.hp = result.newHp;
  log(`${ITEM_CATALOG[itemKey].name} kullandın! ${player.name} ${result.newHp}/${result.maxHp} HP'ye ulaştı.`);
  if (itemKey === 'berry') {
    increaseFriendship(player.instanceId, 3, 'berry');
    recordAdventureEvent('use_berry');
  }

  enemyCounterAttack();
  if (handleFaintCheck()) return;
  renderBattle();
}

function giveUp() {
  if (battleEnded) return;
  battleEnded = true;
  endLeagueAttempt(leagueId);
  showResult({ title: '🏳️ Ligden vazgeçtin.', rewards: [], continueLabel: 'Geri Dön', note: 'Bir sonraki denemede Elit Dörtlü\'nün başından başlarsın.' });
}

// Called when the current stage's whole team has been defeated - either
// hands off to the next Elite Four member (gauntlet continues, HP carries
// over untouched) or, for the Champion, ends the whole run as a win.
function onStageCleared() {
  const stage = stages[stageIdx];
  if (stage.kind === 'champion') {
    endBattle('win');
    return;
  }
  const result = awardEliteFourVictory(leagueId, stage.stageId);
  recordAdventureEvent('league_progress');
  let pokemonXp = 0;
  if (!result.alreadyWon) {
    // Scaled by the enemy team's own level, not a small fraction of
    // trainerXp - see gym-battle.html's identical reasoning.
    const avgEnemyLevel = stage.data.team.reduce((s, m) => s + m.level, 0) / stage.data.team.length;
    pokemonXp = Math.round(avgEnemyLevel * 15);
    awardPokemonBattleXp(pokemonXp);
  }
  const rewards = result.alreadyWon ? [] : [`👑 +${result.trainerXp} Eğitmen XP`, `⭐ +${pokemonXp} Pokémon XP`, `💰 +${result.coins} PokéCoin`];
  const selfieUrl = `victory-selfie.html?type=league_elitefour&leagueId=${leagueId}&stageId=${stage.stageId}`;
  battleEnded = true;
  el('wrap').innerHTML = `
    <div class="card">
      <div class="result-title">✅ ${stage.data.name} Yenildi!</div>
      ${rewards.length ? `<div class="reward-row">${rewards.map(r => `<span class="reward-chip badge-chip">${r}</span>`).join('')}</div>` : '<p style="text-align:center;color:#888;font-size:13px;">Bu üyeyi daha önce yenmiştin - ödül tekrar verilmiyor.</p>'}
      <p style="text-align:center;color:#888;font-size:13px;">${player.name}: ${player.hp}/${player.maxHp} HP ile bir sonraki rakibe geçiyor.</p>
      <button class="continue-btn" id="selfieBtn" style="background:#8e44ad;">📸 Victory Selfie</button>
      <button class="continue-btn" id="nextStageBtn">Sonraki Rakip ➜</button>
    </div>`;
  el('selfieBtn').addEventListener('click', () => { window.location.href = selfieUrl; });
  el('nextStageBtn').addEventListener('click', async () => {
    stageIdx++;
    battleEnded = false;
    enemyIndex = 0;
    foughtInstanceIds = new Set([player.instanceId]);
    await loadEnemyAndRender();
  });
}

function endBattle(outcome) {
  battleEnded = true;
  if (outcome === 'win') {
    const result = awardChampionVictory(leagueId);
    recordAdventureEvent('league_progress');
    const regionName = REGIONS[league.regionId] ? REGIONS[league.regionId].name : league.regionId;
    if (result.alreadyCompleted) {
      showResult({
        title: `🏆 ${regionName} Şampiyonu'nu tekrar yendin!`,
        rewards: [],
        note: `${regionName} zaten tamamlandı - ödüller yalnızca ilk galibiyette verilir.`,
        continueLabel: 'Haritaya Dön'
      });
    } else {
      // Scaled by the Champion's own team level, not a small fraction of
      // trainerXp - see gym-battle.html's identical reasoning.
      const avgEnemyLevel = league.champion.team.reduce((s, m) => s + m.level, 0) / league.champion.team.length;
      const pokemonXp = Math.round(avgEnemyLevel * 15);
      awardPokemonBattleXp(pokemonXp);
      const unlockRegionName = league.unlocksRegion && REGIONS[league.unlocksRegion] ? REGIONS[league.unlocksRegion].name : league.unlocksRegion;
      showResult({
        title: `🏆 ${regionName.toUpperCase()} CHAMPION 🏆`,
        rewards: [
          `👑 +${result.trainerXp} Eğitmen XP`,
          `⭐ +${pokemonXp} Pokémon XP`,
          `💰 +${result.coins} PokéCoin`,
          ...(unlockRegionName ? [`🌎 ${unlockRegionName} Unlocked!`] : [])
        ],
        note: `${regionName} Ligini tamamladın!${unlockRegionName ? ` ${unlockRegionName}\'nun içeriği yakında geliyor.` : ''}`,
        continueLabel: 'Haritaya Dön',
        selfieUrl: `victory-selfie.html?type=league_champion&leagueId=${leagueId}`
      });
    }
  } else {
    endLeagueAttempt(leagueId);
    showResult({
      title: `😵 ${stages[stageIdx].data.name} seni yendi...`,
      rewards: [],
      continueLabel: 'Haritaya Dön',
      note: 'Pokémon\'unu iyileştirip tekrar deneyebilirsin - ancak bir sonraki denemede Elit Dörtlü\'nün başından başlarsın.'
    });
  }
}

function showResult({ title, rewards, continueLabel, note, selfieUrl }) {
  el('wrap').innerHTML = `
    <div class="card">
      <div class="result-title">${title}</div>
      ${rewards.length ? `<div class="reward-row">${rewards.map(r => `<span class="reward-chip badge-chip">${r}</span>`).join('')}</div>` : ''}
      ${note ? `<p style="text-align:center;color:#888;font-size:13px;">${note}</p>` : ''}
      ${selfieUrl ? `<button class="continue-btn" id="selfieBtn" style="background:#8e44ad;">📸 Victory Selfie</button>` : ''}
      <button class="continue-btn" id="continueBtn">${continueLabel}</button>
    </div>`;
  // Rewards/completion/region-unlock are already fully applied above, before
  // this screen ever renders - navigating away via either button (or the
  // Selfie flow's own Skip) can never affect them (Phase 9 requirement).
  if (selfieUrl) el('selfieBtn').addEventListener('click', () => { window.location.href = selfieUrl; });
  el('continueBtn').addEventListener('click', () => { window.location.href = 'adventure.html'; });
}

function init() {
  if (!league) {
    el('wrap').innerHTML = '<div class="card"><p>Geçersiz Lig. <a href="adventure.html">Haritaya dön</a>.</p></div>';
    return;
  }
  const player0 = getAdventurePlayer();
  if (!isRegionUnlocked(player0, league.regionId)) {
    el('wrap').innerHTML = `<div class="card"><p class="locked-msg">🔒 ${REGIONS[league.regionId] ? REGIONS[league.regionId].name : league.regionId} henüz kilitli.</p></div>`;
    return;
  }
  if (!isLeagueUnlocked(league, player0)) {
    el('wrap').innerHTML = `<div class="card"><p class="locked-msg">🔒 Pokémon Ligine girmek için önce 8 Salon rozetini kazanmalısın.</p></div>`;
    return;
  }
  const attempt = getActiveLeagueAttempt(leagueId);
  if (attempt) {
    resumeAttempt(attempt);
  } else {
    loadTeamPreviewAndRender();
  }
}

waitForAdventureCloud().then(init);
</script>

</body>
</html>
