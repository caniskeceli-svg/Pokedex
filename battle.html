<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savaş Arenası</title>
<style>
  :root { --card: #ffffff; --ink: #2b2b2b; --accent: #e3350d; --accent-dark: #a82008; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffe27a 0%, #fff7e6 220px);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 50px;
  }
  header { text-align: center; padding: 20px 16px 6px; }
  header h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 38px);
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  .nav-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .nav-row a { color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: bold; text-decoration: none; font-size: 14px; }
  .nav-back { background: #3b6cdb; }
  .nav-mine { background: #f39c12; }
  .nav-teams { background: #9b59b6; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .arena { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 18px; }
  .side { flex: 1 1 320px; min-width: 280px; }

  .side-card {
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
  }
  .side-card.mine { border-top: 6px solid #3b6cdb; }
  .side-card.guest { border-top: 6px solid #c0392b; }
  .side-title { font-size: 16px; font-weight: bold; color: var(--accent-dark); margin-bottom: 8px; }
  .side-title .tag { font-size: 11px; background: #eee; color: #888; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }

  select {
    width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #eee; font-size: 15px; margin-bottom: 10px;
  }

  .editor-count { text-align: center; font-size: 12px; color: #888; margin-bottom: 8px; }
  .reset-link { text-align: center; font-size: 12px; color: #c0392b; cursor: pointer; margin-top: 4px; }

  .guest-search { position: relative; margin-bottom: 10px; }
  .guest-search-row { display: flex; gap: 6px; }
  .guest-search input {
    flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 2px solid #eee; font-size: 14px;
  }
  .guest-search button {
    background: #c0392b; color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-weight: bold; cursor: pointer;
  }
  .guest-suggestions {
    position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 2px solid #c0392b;
    border-radius: 12px; margin-top: 4px; max-height: 180px; overflow-y: auto; z-index: 20; display: none;
  }
  .guest-suggestions div { padding: 8px 14px; cursor: pointer; text-transform: capitalize; font-size: 14px; }
  .guest-suggestions div:hover { background: #ffe6e6; }
  .guest-search-status { font-size: 12px; color: #c0392b; min-height: 16px; margin-bottom: 6px; }

  .guest-roster { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .guest-roster-item { position: relative; text-align: center; background: #f7f7f7; border-radius: 10px; padding: 6px; width: 64px; }
  .guest-roster-item img { width: 40px; height: 40px; }
  .guest-roster-item span { display: block; font-size: 10px; text-transform: capitalize; }
  .guest-roster-item .rm { position: absolute; top: -4px; right: -2px; background: #c0392b; color: #fff; border-radius: 999px; width: 16px; height: 16px; font-size: 11px; line-height: 16px; cursor: pointer; }

  .detail-label { font-size: 12px; font-weight: bold; color: #999; margin: 10px 0 6px; text-align: left; }
  .team-members { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .team-member { text-align: center; width: 58px; }
  .team-member img { width: 44px; height: 44px; }
  .team-member span { display: block; font-size: 10px; text-transform: capitalize; }
  .team-stats { display: flex; gap: 14px; font-size: 12px; color: #666; margin-bottom: 8px; }
  .team-stats b { display: block; font-size: 16px; color: var(--accent-dark); }
  .team-coverage { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .type-chip { font-size: 10px; padding: 3px 7px; border-radius: 999px; color: #fff; }
  .type-chip .cnt { opacity: 0.85; font-size: 9px; margin-left: 2px; }
  .team-statbars { text-align: left; margin-bottom: 4px; }
  .team-statbar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11px; }
  .team-statbar-label { width: 80px; flex-shrink: 0; text-align: right; color: #666; }
  .team-statbar-track { flex: 1; background: #eee; border-radius: 6px; height: 8px; overflow: hidden; }
  .team-statbar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #3b6cdb, #7aa5f0); }
  .team-statbar-val { width: 26px; flex-shrink: 0; font-weight: bold; color: var(--accent-dark); font-size: 11px; }
  .no-stats-note { font-size: 11px; color: #aaa; font-style: italic; margin-bottom: 8px; }

  .vs-badge {
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: bold; color: var(--accent-dark);
    flex: 0 0 60px;
  }

  .battle-btn {
    display: block; width: 100%; max-width: 300px; margin: 22px auto 0;
    background: #c0392b; color: #fff; border: none; padding: 16px; border-radius: 999px;
    font-size: 20px; font-weight: bold; cursor: pointer;
  }
  .battle-btn:disabled { background: #ccc; cursor: not-allowed; }

  .arena-log {
    max-width: 500px; margin: 20px auto 0; background: #fff; border-radius: 20px;
    padding: 24px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,0.1); display: none;
  }
  .arena-log.show { display: block; }
  .round-title { font-size: 14px; color: #999; margin-bottom: 10px; }
  .round-fighters { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .fighter { text-align: center; width: 150px; }
  .fighter img { width: 72px; height: 72px; }
  .fighter .f-name { font-weight: bold; text-transform: capitalize; font-size: 15px; }
  .fighter .f-score { font-size: 13px; color: var(--accent-dark); font-weight: bold; margin-top: 2px; }
  .fighter.loser { opacity: 0.4; }
  .fighter .f-types { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; margin: 4px 0; }
  .fighter .f-stats { text-align: left; font-size: 10px; color: #666; margin-top: 6px; }
  .fighter .f-stats div { display: flex; justify-content: space-between; padding: 1px 4px; }
  .fighter .f-stats b { color: var(--accent-dark); }
  .fighter .f-effect { font-size: 10px; margin-top: 4px; font-weight: bold; }
  .fighter .f-effect.super { color: #27ae60; }
  .fighter .f-effect.weak { color: #c0392b; }
  .round-vs { font-size: 22px; font-weight: bold; color: #999; }
  .round-result { font-size: 17px; font-weight: bold; margin-bottom: 16px; }
  .round-result.won { color: #27ae60; }
  .next-round-btn {
    background: #3b6cdb; color: #fff; border: none; padding: 12px 26px;
    border-radius: 999px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .final-banner {
    font-size: 26px; font-weight: bold; color: var(--accent-dark); margin-bottom: 10px;
  }

  .empty-box { text-align: center; color: #a6925a; font-size: 15px; background: #fff; border-radius: 18px; padding: 24px 20px; margin-top: 16px; }

  .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .mode-tab {
    background: #eee; color: #666; border: none; padding: 10px 20px; border-radius: 999px;
    font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .mode-tab.active { background: #c0392b; color: #fff; }

  .challenge-section { background: #fff; border-radius: 20px; padding: 16px; margin-top: 16px; }
  .challenge-section h3 { margin-top: 0; color: var(--accent-dark); font-size: 17px; }
  .challenge-card {
    background: #fff5f0; border: 2px solid #ffcfc0; border-radius: 14px; padding: 12px; margin-bottom: 10px;
  }
  .challenge-card .c-title { font-weight: bold; color: var(--accent-dark); margin-bottom: 6px; }
  .challenge-card .c-actions { display: flex; gap: 8px; margin-top: 8px; }
  .challenge-card .c-actions button { flex: 1; padding: 8px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
  .accept-btn { background: #27ae60; }
  .decline-btn { background: #c0392b; }
  .history-card {
    background: #f9f9f9; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; color: #555;
  }
  .history-card b { color: var(--accent-dark); }
  .score-row { display: flex; justify-content: center; gap: 30px; }
  .score-box { text-align: center; }
  .score-box .s-name { font-size: 14px; font-weight: bold; color: #666; }
  .score-box .s-num { font-size: 32px; font-weight: bold; color: var(--accent-dark); }
  .score-vs { font-size: 20px; color: #ccc; align-self: center; }
  .team-record-list { display: flex; flex-direction: column; gap: 6px; }
  .team-record-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #f9f9f9; border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>⚔️ Savaş Arenası ⚔️</h1>
  <div class="nav-row">
    <a class="nav-back" href="index.html">⬅️ Pokédex</a>
    <a class="nav-mine" href="mypokemon.html">⭐ Pokémonlarım</a>
    <a class="nav-teams" href="teams.html">🛡️ Takımlarım</a>
  </div>
</header>

<div class="wrap">
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabPractice">🎮 Antrenman</button>
    <button class="mode-tab" id="tabChallenge">⚔️ Meydan Okuma</button>
  </div>
  <div id="setupArea"></div>
  <div id="challengeArea" style="display:none;"></div>
  <div id="arenaLog" class="arena-log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="pokedex-data.js"></script>
<script>
const el = (id) => document.getElementById(id);
const setupArea = el('setupArea');
let mydex = [];
let tempTeam = getTempTeam();
let allPokeNames = [];

fetch('https://pokeapi.co/api/v2/pokemon?limit=1302')
  .then(r => r.json())
  .then(d => { allPokeNames = d.results.map(p => p.name); })
  .catch(() => {});

function typeChip(t, count) { return typeChipHtml(t, count); }

function myTeamOptionsHtml() {
  const teams = getTeams();
  if (!teams.length) return null;
  return teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
}

function renderSetup() {
  mydex = getMyDexShared();
  const teams = getTeams();

  if (!teams.length) {
    setupArea.innerHTML = `
      <div class="empty-box">
        Önce Ayaz için bir takım kurman lazım.<br>
        <a href="teams.html">🛡️ Takımlarım</a> sayfasından bir takım oluştur, sonra buraya dön!
      </div>`;
    return;
  }
  if (!mydex.length) {
    setupArea.innerHTML = `<div class="empty-box">Önce Pokédex'ten birkaç Pokémon yakalamalısın!</div>`;
    return;
  }

  const savedTeamId = teams[0].id;

  setupArea.innerHTML = `
    <div class="arena">
      <div class="side">
        <div class="side-card mine">
          <div class="side-title">🛡️ Ayaz'ın Takımı <span class="tag">kalıcı</span></div>
          <select id="teamSelect">${myTeamOptionsHtml()}</select>
          <div id="myTeamDetail"></div>
        </div>
      </div>

      <div class="vs-badge">VS</div>

      <div class="side">
        <div class="side-card guest">
          <div class="side-title">🎮 Rakip Takım <span class="tag">geçici, kaydedilmez</span></div>
          <div class="editor-count" id="tempCount"></div>
          <div class="guest-search">
            <div class="guest-search-row">
              <input type="text" id="guestSearchInput" placeholder="Herhangi bir Pokémon adı yaz...">
              <button id="guestAddBtn">➕ Ekle</button>
            </div>
            <div class="guest-suggestions" id="guestSuggestions"></div>
          </div>
          <div class="guest-search-status" id="guestSearchStatus"></div>
          <div class="guest-roster" id="guestRoster"></div>
          <div id="guestTeamDetail"></div>
          <div class="reset-link" id="resetTemp">🔄 Rakip takımı sıfırla</div>
        </div>
      </div>
    </div>
    <button class="battle-btn" id="battleBtn">⚔️ Savaştır!</button>
  `;

  el('teamSelect').value = localStorage.getItem('ayaz_last_battle_team') || savedTeamId;
  el('teamSelect').addEventListener('change', () => {
    localStorage.setItem('ayaz_last_battle_team', el('teamSelect').value);
    renderMyTeamDetail();
  });
  renderMyTeamDetail();

  renderGuestRoster();
  renderGuestDetail();
  wireGuestSearch();

  el('resetTemp').addEventListener('click', () => {
    tempTeam = { name: 'Rakip Takım', members: [] };
    saveTempTeam(tempTeam);
    renderGuestRoster();
    renderGuestDetail();
  });

  el('battleBtn').addEventListener('click', startBattle);
}

function wireGuestSearch() {
  const input = el('guestSearchInput');
  const suggestions = el('guestSuggestions');

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    if (!q) { suggestions.style.display = 'none'; return; }
    const matches = allPokeNames.filter(n => n.startsWith(q)).slice(0, 8);
    if (!matches.length) { suggestions.style.display = 'none'; return; }
    suggestions.innerHTML = matches.map(n => `<div data-name="${n}">${n}</div>`).join('');
    suggestions.style.display = 'block';
    suggestions.querySelectorAll('div').forEach(d => {
      d.addEventListener('click', () => {
        input.value = d.dataset.name;
        suggestions.style.display = 'none';
        addGuestPokemon(d.dataset.name);
      });
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.guest-search')) suggestions.style.display = 'none';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addGuestPokemon(input.value);
  });
  el('guestAddBtn').addEventListener('click', () => addGuestPokemon(input.value));
}

async function addGuestPokemon(query) {
  const name = String(query || '').trim();
  if (!name) return;
  if (tempTeam.members.length >= 6) {
    el('guestSearchStatus').textContent = 'Bir takımda en fazla 6 Pokémon olabilir!';
    return;
  }
  el('guestSearchStatus').textContent = 'Aranıyor... ⏳';
  try {
    const poke = await fetchPokemonAsTeamMember(name);
    if (tempTeam.members.some(m => m.id === poke.id)) {
      el('guestSearchStatus').textContent = 'Bu Pokémon zaten takımda!';
      return;
    }
    tempTeam.members.push(poke);
    saveTempTeam(tempTeam);
    el('guestSearchInput').value = '';
    el('guestSearchStatus').textContent = '';
    renderGuestRoster();
    renderGuestDetail();
  } catch {
    el('guestSearchStatus').textContent = 'Bulunamadı 😕 Adı kontrol et.';
  }
}

function removeGuestPokemon(id) {
  tempTeam.members = tempTeam.members.filter(m => m.id !== id);
  saveTempTeam(tempTeam);
  renderGuestRoster();
  renderGuestDetail();
}

function renderGuestRoster() {
  el('tempCount').textContent = `${tempTeam.members.length} / 6 seçildi`;
  el('guestRoster').innerHTML = tempTeam.members.map(m => `
    <div class="guest-roster-item">
      <span class="rm" data-rm="${m.id}">✕</span>
      <img src="${m.img}" alt="${m.name}">
      <span>${m.name}</span>
    </div>`).join('') || '<span style="color:#999;font-size:12px;">Henüz üye yok</span>';

  el('guestRoster').querySelectorAll('[data-rm]').forEach(x => {
    x.addEventListener('click', () => removeGuestPokemon(Number(x.dataset.rm)));
  });
}

function getSelectedMyTeam() {
  const teams = getTeams();
  return teams.find(t => t.id === el('teamSelect').value) || teams[0];
}

function renderMyTeamDetail() {
  const team = getSelectedMyTeam();
  const members = team.memberIds.map(id => mydex.find(p => p.id === id)).filter(Boolean);
  el('myTeamDetail').innerHTML = renderTeamDetailHtml(members);
}

function renderGuestDetail() {
  el('guestTeamDetail').innerHTML = renderTeamDetailHtml(tempTeam.members);
}

// ---- Battle simulation (shared by practice mode and real challenges) ----
function computeBattleRounds(membersA, membersB) {
  const rounds = [];
  let i = 0, j = 0;
  while (i < membersA.length && j < membersB.length) {
    const A = membersA[i];
    const B = membersB[j];
    const multA = bestMultiplier(A.types, B.types);
    const multB = bestMultiplier(B.types, A.types);
    const scoreA = Math.round((A.power || 100) * multA * (0.85 + Math.random() * 0.3));
    const scoreB = Math.round((B.power || 100) * multB * (0.85 + Math.random() * 0.3));
    const aWins = scoreA >= scoreB;
    rounds.push({ A, B, multA, multB, scoreA, scoreB, aWins });
    if (aWins) j++; else i++;
  }
  return { rounds, winnerSide: (i < membersA.length) ? 'A' : 'B' };
}

let uiRounds = [];
let uiIndex = 0;
let uiOnFinish = null;

function runBattleUI(membersA, membersB, onFinish) {
  const { rounds, winnerSide } = computeBattleRounds(membersA, membersB);
  uiRounds = rounds;
  uiIndex = 0;
  uiOnFinish = () => onFinish(winnerSide, rounds);

  el('setupArea').style.display = 'none';
  el('challengeArea').style.display = 'none';
  el('arenaLog').classList.add('show');
  renderRound();
  el('arenaLog').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fighterCardHtml(fighter, mult, isLoser) {
  const statRow = (key, label) => `<div><span>${label}</span><b>${fighter.stats?.[key] ?? '-'}</b></div>`;
  const effectHtml = mult > 1
    ? `<div class="f-effect super">💥 Etkili (x${mult})</div>`
    : mult < 1
      ? `<div class="f-effect weak">😣 Etkisiz (x${mult})</div>`
      : '';
  return `
    <div class="fighter ${isLoser ? 'loser' : ''}">
      <img src="${fighter.img}" alt="${fighter.name}">
      <div class="f-name">${fighter.nickname || fighter.name}</div>
      <div class="f-types">${(fighter.types || []).map(t => `<span class="type-chip" style="background:${TYPE_COLORS[t]}">${TYPE_TR[t] || t}</span>`).join('')}</div>
      <div class="f-stats">
        ${statRow('hp', 'Can')}
        ${statRow('attack', 'Sal')}
        ${statRow('defense', 'Sav')}
        ${statRow('special-attack', 'Ö.Sal')}
        ${statRow('special-defense', 'Ö.Sav')}
        ${statRow('speed', 'Hız')}
      </div>
      <div class="f-score">💪 ${fighter.__score}</div>
      ${effectHtml}
    </div>`;
}

function renderRound() {
  if (uiIndex >= uiRounds.length) {
    uiOnFinish();
    return;
  }
  const r = uiRounds[uiIndex];
  const log = el('arenaLog');
  const fighterA = Object.assign({}, r.A, { __score: r.scoreA });
  const fighterB = Object.assign({}, r.B, { __score: r.scoreB });
  log.innerHTML = `
    <div class="round-title">Raunt ${uiIndex + 1} / ${uiRounds.length}</div>
    <div class="round-fighters">
      ${fighterCardHtml(fighterA, r.multA, !r.aWins)}
      <div class="round-vs">VS</div>
      ${fighterCardHtml(fighterB, r.multB, r.aWins)}
    </div>
    <div class="round-result won">${r.aWins ? '🛡️ ' + (r.A.nickname || r.A.name) : '🎮 ' + (r.B.nickname || r.B.name)} kazandı! ${r.aWins ? (r.B.nickname || r.B.name) : (r.A.nickname || r.A.name)} yenildi 💫</div>
    <button class="next-round-btn" id="nextRoundBtn">${uiIndex + 1 < uiRounds.length ? 'Sonraki Raunt ➜' : 'Sonucu Gör 🏆'}</button>
  `;
  el('nextRoundBtn').addEventListener('click', () => {
    uiIndex++;
    renderRound();
  });
}

function startBattle() {
  const myTeam = getSelectedMyTeam();
  const myMembers = myTeam.memberIds.map(id => mydex.find(p => p.id === id)).filter(Boolean);
  const guestMembers = tempTeam.members;

  if (!myMembers.length || !guestMembers.length) {
    alert('Her iki takımda da en az 1 Pokémon olmalı!');
    return;
  }

  runBattleUI(myMembers, guestMembers, (winnerSide) => {
    const myWon = winnerSide === 'A';
    if (myWon) addXP(30);
    el('arenaLog').innerHTML = `
      <div class="final-banner">${myWon ? '🏆 Kazandın! 🏆' : '🎮 Rakip Takım Kazandı!'}</div>
      <div style="font-size:40px;margin-bottom:14px;">${myWon ? '🥳🎉🛡️' : '😮💥'}</div>
      ${myWon ? '<div style="color:#27ae60;font-weight:bold;margin-bottom:16px;">+30 XP kazandın!</div>' : ''}
      <button class="next-round-btn" id="battleAgainBtn">🔄 Tekrar Savaştır</button>
    `;
    el('battleAgainBtn').addEventListener('click', () => {
      el('arenaLog').classList.remove('show');
      el('setupArea').style.display = '';
      renderSetup();
    });
  });
}

// ---- Meydan Okuma (real challenges between profiles) ----
function switchTab(tab) {
  const practice = tab === 'practice';
  el('tabPractice').classList.toggle('active', practice);
  el('tabChallenge').classList.toggle('active', !practice);
  el('setupArea').style.display = practice ? '' : 'none';
  el('challengeArea').style.display = practice ? 'none' : '';
  el('arenaLog').classList.remove('show');
  if (!practice) renderChallengeTab();
}
el('tabPractice').addEventListener('click', () => switchTab('practice'));
el('tabChallenge').addEventListener('click', () => switchTab('challenge'));

let unsubscribeIncoming = null;

function renderChallengeTab() {
  const area = el('challengeArea');
  const teams = getTeams();
  const otherName = PROFILE_INFO[getOtherProfile(CURRENT_PROFILE)].name;

  area.innerHTML = `
    <div class="challenge-section" id="scoreboardBox">
      <h3>🏅 Skor Tablosu</h3>
      <p style="color:#999;font-size:13px;">Yükleniyor...</p>
    </div>
    <div class="challenge-section">
      <h3>📥 Gelen Meydan Okumalar</h3>
      <div id="incomingList"><p style="color:#999;font-size:13px;">Yükleniyor...</p></div>
    </div>
    <div class="challenge-section">
      <h3>📤 ${otherName}'a Meydan Oku</h3>
      ${teams.length ? `
        <select id="challengeTeamSelect">${teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#666;margin:8px 0;">
          <input type="checkbox" id="hideTeamCheckbox" style="width:16px;height:16px;">
          🙈 Takımımı gizle (rakibim kabul edene kadar göremesin, sürpriz olsun!)
        </label>
        <button class="next-round-btn" id="sendChallengeBtn" style="width:100%;">⚔️ Meydan Oku!</button>
        <div id="sendChallengeStatus" style="font-size:12px;color:#c0392b;margin-top:6px;"></div>
      ` : `<p style="color:#999;font-size:13px;">Önce Takımlarım sayfasından bir takım kurman lazım.</p>`}
    </div>
    <div class="challenge-section">
      <h3>📜 Geçmiş</h3>
      <div id="historyList"><p style="color:#999;font-size:13px;">Yükleniyor...</p></div>
    </div>
  `;

  if (teams.length) {
    el('sendChallengeBtn').addEventListener('click', () => {
      const team = teams.find(t => t.id === el('challengeTeamSelect').value);
      const members = team.memberIds.map(id => mydex.find(p => p.id === id)).filter(Boolean);
      if (!members.length) {
        el('sendChallengeStatus').textContent = 'Bu takımda hiç Pokémon yok!';
        return;
      }
      const hidden = el('hideTeamCheckbox').checked;
      sendChallenge(team.name, members, hidden, team.id).then(() => {
        el('sendChallengeStatus').textContent = '✅ Meydan okuma gönderildi!';
      }).catch(() => {
        el('sendChallengeStatus').textContent = 'Gönderilemedi, tekrar dene.';
      });
    });
  }

  if (unsubscribeIncoming) unsubscribeIncoming();
  unsubscribeIncoming = listenIncomingChallenges(renderIncomingList);
  renderHistoryList();
}

function renderIncomingList(list) {
  const box = el('incomingList');
  if (!box) return;
  if (!list.length) {
    box.innerHTML = `<p style="color:#999;font-size:13px;">Şu an bekleyen bir meydan okuma yok.</p>`;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="challenge-card" data-id="${c.id}">
      <div class="c-title">${c.hidden
        ? `${c.fromName} sana gizli bir meydan okuma gönderdi! 🙈 Takımını ancak kabul edince göreceksin.`
        : `${c.fromName} sana meydan okudu: "${c.fromTeamName}"`}</div>
      <div id="acceptArea-${c.id}"></div>
      <div class="c-actions">
        <button class="accept-btn" data-accept="${c.id}">✅ Kabul Et</button>
        <button class="decline-btn" data-decline="${c.id}">❌ Reddet</button>
      </div>
    </div>`).join('');

  box.querySelectorAll('[data-decline]').forEach(b => {
    b.addEventListener('click', () => declineChallenge(b.dataset.decline));
  });
  box.querySelectorAll('[data-accept]').forEach(b => {
    b.addEventListener('click', () => {
      const challenge = list.find(c => c.id === b.dataset.accept);
      openAcceptPicker(challenge);
    });
  });
}

function openAcceptPicker(challenge) {
  const teams = getTeams();
  if (!teams.length) {
    alert('Önce Takımlarım sayfasından bir takım kurman lazım!');
    return;
  }
  const acceptArea = document.getElementById(`acceptArea-${challenge.id}`);
  acceptArea.innerHTML = `
    <select id="defendTeamSelect-${challenge.id}">${teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select>
    <button class="next-round-btn" style="width:100%;margin-top:6px;" id="confirmAccept-${challenge.id}">⚔️ Onayla ve Savaş!</button>
  `;
  document.getElementById(`confirmAccept-${challenge.id}`).addEventListener('click', () => {
    const team = teams.find(t => t.id === document.getElementById(`defendTeamSelect-${challenge.id}`).value);
    const myMembers = team.memberIds.map(id => mydex.find(p => p.id === id)).filter(Boolean);
    if (!myMembers.length) { alert('Bu takımda hiç Pokémon yok!'); return; }

    runBattleUI(myMembers, challenge.fromTeam, (winnerSide, rounds) => {
      const iWon = winnerSide === 'A';
      if (iWon) addXP(30);
      completeChallenge(challenge.id, {
        toTeamName: team.name,
        toTeamId: team.id,
        rounds,
        winnerSide: iWon ? 'to' : 'from'
      });
      el('arenaLog').innerHTML = `
        <div class="final-banner">${iWon ? '🏆 Meydan Okumayı Kazandın! 🏆' : '😮 Meydan Okumayı Kaybettin'}</div>
        <div style="font-size:40px;margin-bottom:14px;">${iWon ? '🥳🎉🛡️' : '😮💥'}</div>
        ${iWon ? '<div style="color:#27ae60;font-weight:bold;margin-bottom:16px;">+30 XP kazandın!</div>' : ''}
        <button class="next-round-btn" id="backToChallengeBtn">⬅️ Meydan Okumalara Dön</button>
      `;
      document.getElementById('backToChallengeBtn').addEventListener('click', () => {
        el('arenaLog').classList.remove('show');
        el('challengeArea').style.display = '';
        renderChallengeTab();
      });
    });
  });
}

function renderHistoryList() {
  const box = el('historyList');
  if (!box) return;
  listenMyChallengeHistory(list => {
    const completed = list.filter(c => c.status === 'completed');
    renderScoreboard(completed);

    const finished = list.filter(c => c.status === 'completed' || c.status === 'declined');
    if (!finished.length) {
      box.innerHTML = `<p style="color:#999;font-size:13px;">Henüz tamamlanmış bir meydan okuma yok.</p>`;
      return;
    }
    box.innerHTML = finished.slice(0, 10).map(c => {
      if (c.status === 'declined') {
        return `<div class="history-card">${c.fromName} → ${c.toName}: reddedildi</div>`;
      }
      const winnerName = c.winnerSide === 'from' ? c.fromName : c.toName;
      return `<div class="history-card">${c.fromName} (${c.fromTeamName}) vs ${c.toName} (${c.toTeamName || '?'}) — kazanan: <b>${winnerName}</b></div>`;
    }).join('');
  });
}

async function renderScoreboard(completed) {
  const scoreboardBox = el('scoreboardBox');
  if (!scoreboardBox) return;
  const wins = {};
  Object.keys(PROFILE_INFO).forEach(id => wins[id] = 0);
  completed.forEach(c => {
    const winnerProfile = c.winnerSide === 'from' ? c.fromProfile : c.toProfile;
    if (wins[winnerProfile] !== undefined) wins[winnerProfile]++;
  });
  const [idA, idB] = Object.keys(PROFILE_INFO);

  // Gather every team from both profiles so the breakdown covers both sides.
  const otherId = getOtherProfile(CURRENT_PROFILE);
  let otherTeams = [];
  try {
    const snap = await cloudDb.collection('profiles').doc(otherId).get();
    otherTeams = (snap.data() || {}).teams || [];
  } catch (e) { console.error(e); }
  const myTeams = getTeams();
  const allTeams = [
    ...myTeams.map(t => ({ ...t, owner: CURRENT_PROFILE })),
    ...otherTeams.map(t => ({ ...t, owner: otherId }))
  ];
  const teamRows = allTeams
    .map(t => ({ team: t, record: computeTeamRecord(t.id, completed) }))
    .filter(r => r.record.wins + r.record.losses > 0)
    .sort((a, b) => (b.record.wins - b.record.losses) - (a.record.wins - a.record.losses));

  scoreboardBox.innerHTML = `
    <h3>🏅 Skor Tablosu</h3>
    <div class="score-row">
      <div class="score-box">
        <div class="s-name">${PROFILE_INFO[idA].emoji} ${PROFILE_INFO[idA].name}</div>
        <div class="s-num">${wins[idA]}</div>
      </div>
      <div class="score-vs">—</div>
      <div class="score-box">
        <div class="s-name">${PROFILE_INFO[idB].emoji} ${PROFILE_INFO[idB].name}</div>
        <div class="s-num">${wins[idB]}</div>
      </div>
    </div>
    ${completed.length ? `<p style="text-align:center;font-size:12px;color:#999;margin-top:8px;">Toplam ${completed.length} savaş oynandı</p>` : ''}
    ${teamRows.length ? `
      <div class="detail-label" style="margin-top:14px;">🛡️ Takım Takım Skor</div>
      <div class="team-record-list">
        ${teamRows.map(r => `
          <div class="team-record-row">
            <span>${PROFILE_INFO[r.team.owner].emoji} ${r.team.name}</span>
            <span><b style="color:#27ae60;">${r.record.wins}G</b> — <b style="color:#c0392b;">${r.record.losses}M</b></span>
          </div>`).join('')}
      </div>` : ''}
  `;
}

waitForCloud().then(renderSetup);
</script>
