<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaz'ın Pokémonları</title>
<style>
  :root {
    --card: #ffffff;
    --ink: #2b2b2b;
    --accent: #e3350d;
    --accent-dark: #a82008;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffe27a 0%, #fff7e6 220px);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 50px;
  }
  header { text-align: center; padding: 20px 16px 6px; }
  header h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 38px);
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  .nav-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .nav-row a {
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: bold;
    text-decoration: none;
    font-size: 14px;
  }
  .nav-back { background: #3b6cdb; }
  .nav-teams { background: #9b59b6; }
  .nav-quiz { background: #e67e22; }
  .nav-battle { background: #c0392b; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  .trainer-card {
    background: #2c3e50;
    color: #fff;
    border-radius: 22px;
    padding: 18px 20px;
    margin-top: 18px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15);
  }
  .trainer-card .t-title { font-size: 15px; letter-spacing: 1px; color: #ffd24a; font-weight: bold; }
  .trainer-card .t-level { font-size: 26px; font-weight: bold; margin: 2px 0 10px; }
  .xp-track { background: #445566; border-radius: 999px; height: 20px; overflow: hidden; position: relative; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, #ffd24a, #ffb703); }
  .xp-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #2c3e50;
  }

  .hero {
    background: linear-gradient(135deg, #ffd24a, #ff9a3c);
    border-radius: 26px;
    padding: 22px;
    text-align: center;
    margin-top: 16px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.1);
  }
  .hero .trophy { font-size: 46px; }
  .hero .total-num {
    font-size: clamp(40px, 12vw, 64px);
    font-weight: bold;
    color: #6b3500;
    line-height: 1;
    margin: 4px 0;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
  }
  .hero .total-label { font-size: 16px; color: #6b3500; font-weight: bold; }
  .hero .sub-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 14px;
    font-size: 14px;
    color: #6b3500;
  }
  .hero .sub-stats b { display: block; font-size: 22px; }

  .section-title {
    text-align: center;
    font-size: 20px;
    color: var(--accent-dark);
    margin: 26px 0 12px;
  }

  .bag-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .bag-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .bag-card .b-emoji { font-size: 30px; }
  .bag-card .b-name { font-size: 13px; font-weight: bold; margin: 4px 0 2px; }
  .bag-card .b-count { font-size: 22px; font-weight: bold; color: var(--accent-dark); }

  .badge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .badge-card {
    background: #fff;
    border-radius: 16px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    opacity: 0.35;
    filter: grayscale(1);
  }
  .badge-card.unlocked { opacity: 1; filter: none; border: 2px solid #ffd24a; }
  .badge-card .bd-emoji { font-size: 30px; }
  .badge-card .bd-title { font-size: 13px; font-weight: bold; margin: 4px 0 2px; }
  .badge-card .bd-desc { font-size: 11px; color: #888; }

  .power-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .power-card {
    background: #fff;
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    border: 3px solid transparent;
  }
  .power-card.has-power { border-color: var(--pc, #ccc); }
  .power-card .p-emoji { font-size: 26px; }
  .power-card .p-name { font-size: 13px; font-weight: bold; margin: 2px 0; }
  .power-card .p-val { font-size: 22px; font-weight: bold; color: var(--accent-dark); }
  .power-card.zero .p-val { color: #ccc; }
  .power-card.zero { opacity: 0.55; }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
    font-size: 14px;
  }
  .filter-row input { width: 18px; height: 18px; }

  .mydex-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .mydex-item {
    background: #fff;
    border-radius: 16px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    position: relative;
  }
  .mydex-item:hover { background: #fff3dc; }
  .mydex-item img { width: 64px; height: 64px; }
  .mydex-item .m-name { display: block; font-size: 13px; text-transform: capitalize; font-weight: bold; margin-top: 2px; }
  .mydex-item .m-nick { display: block; font-size: 11px; color: #8e44ad; font-style: italic; }
  .mydex-item .m-power { font-size: 13px; color: var(--accent-dark); font-weight: bold; }
  .mydex-item .m-types { display: flex; gap: 3px; justify-content: center; margin: 4px 0; flex-wrap: wrap; }
  .mydex-item .m-type-dot { font-size: 11px; padding: 2px 6px; border-radius: 999px; color: #fff; }
  .mydex-item .remove-x {
    position: absolute; top: 4px; right: 6px;
    color: #c0392b; font-weight: bold; font-size: 16px; cursor: pointer;
  }
  .mydex-item .fav-mark {
    position: absolute; top: 4px; left: 6px;
    font-size: 15px;
  }

  .empty-box {
    text-align: center;
    color: #a6925a;
    font-size: 16px;
    background: #fff;
    border-radius: 18px;
    padding: 30px 20px;
    margin-top: 16px;
  }
  .empty-box .big-emoji { font-size: 48px; display: block; margin-bottom: 10px; }

  @media (max-width: 420px) {
    .power-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <h1>⭐ Ayaz'ın Pokémonları ⭐</h1>
  <div class="nav-row">
    <a class="nav-back" href="index.html">⬅️ Pokédex'e Dön</a>
    <a class="nav-teams" href="teams.html">🛡️ Takımlarım</a>
    <a class="nav-battle" href="battle.html">⚔️ Savaştır</a>
    <a class="nav-quiz" href="quiz.html">❓ Quiz Oyna</a>
  </div>
</header>

<div class="wrap">

  <div class="trainer-card">
    <div class="t-title">AYAZ — TRAINER</div>
    <div class="t-level" id="trainerLevel">Seviye 1</div>
    <div class="xp-track">
      <div class="xp-fill" id="xpFill" style="width:0%"></div>
      <div class="xp-text" id="xpText">0 / 1000 XP</div>
    </div>
  </div>

  <div class="hero">
    <div class="trophy">🏆</div>
    <div class="total-num" id="grandTotal">0</div>
    <div class="total-label">TOPLAM GÜÇ</div>
    <div class="sub-stats">
      <div><b id="pokeCount">0</b>Pokémon</div>
      <div><b id="avgPower">0</b>Ortalama Güç</div>
      <div><b id="strongestName">-</b>En Güçlüsü</div>
    </div>
  </div>

  <div class="section-title">🎒 Çantam</div>
  <div class="bag-grid" id="bagGrid"></div>

  <div class="section-title">🏅 Rozetlerim</div>
  <div class="badge-grid" id="badgeGrid"></div>

  <div class="section-title">🔥 Tip Güçlerim ⚡</div>
  <div class="power-grid" id="powerGrid"></div>

  <div class="section-title">📦 Koleksiyonum</div>
  <div class="filter-row">
    <input type="checkbox" id="favOnly">
    <label for="favOnly">Sadece favorilerimi göster ⭐</label>
  </div>
  <div id="collectionArea"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="pokedex-data.js"></script>
<script>
const el = (id) => document.getElementById(id);

function renderTrainerCard() {
  const player = getPlayer();
  const { level, xpIntoLevel, xpForNextLevel } = levelInfo(player.xp);
  el('trainerLevel').textContent = `Seviye ${level}`;
  el('xpFill').style.width = Math.round((xpIntoLevel / xpForNextLevel) * 100) + '%';
  el('xpText').textContent = `${xpIntoLevel} / ${xpForNextLevel} XP`;
}

function renderBag() {
  const inv = getInventory();
  el('bagGrid').innerHTML = Object.keys(ITEM_INFO).map(key => {
    const info = ITEM_INFO[key];
    return `
      <div class="bag-card">
        <div class="b-emoji">${info.emoji}</div>
        <div class="b-name">${info.name}</div>
        <div class="b-count">${inv[key] || 0}</div>
      </div>`;
  }).join('');
}

function renderBadges() {
  const player = getPlayer();
  el('badgeGrid').innerHTML = ACHIEVEMENTS.map(a => {
    const unlocked = player.achievements.includes(a.id);
    return `
      <div class="badge-card ${unlocked ? 'unlocked' : ''}">
        <div class="bd-emoji">${a.emoji}</div>
        <div class="bd-title">${a.title}</div>
        <div class="bd-desc">${unlocked ? a.desc : '🔒 Henüz kilitli'}</div>
      </div>`;
  }).join('');
}

function computeTypePowers(mydex) {
  const totals = {};
  Object.keys(TYPE_TR).forEach(t => totals[t] = 0);
  mydex.forEach(p => {
    (p.types || []).forEach(t => {
      if (totals[t] !== undefined) totals[t] += (p.power || 0);
    });
  });
  return totals;
}

async function renderDashboard() {
  await backfillMissingStats();
  const mydex = getMyDexShared();

  renderTrainerCard();
  renderBag();
  renderBadges();

  const grandTotal = mydex.reduce((sum, p) => sum + (p.power || 0), 0);
  el('grandTotal').textContent = grandTotal;
  el('pokeCount').textContent = mydex.length;
  el('avgPower').textContent = mydex.length ? Math.round(grandTotal / mydex.length) : 0;
  const strongest = mydex.slice().sort((a, b) => (b.power || 0) - (a.power || 0))[0];
  el('strongestName').textContent = strongest ? (strongest.nickname || strongest.name) : '-';

  const typePowers = computeTypePowers(mydex);
  const grid = el('powerGrid');
  grid.innerHTML = Object.keys(TYPE_TR).map(t => {
    const val = typePowers[t];
    const zero = val === 0;
    return `
      <div class="power-card ${zero ? 'zero' : 'has-power'}" style="--pc:${TYPE_COLORS[t]}">
        <div class="p-emoji">${TYPE_EMOJI[t]}</div>
        <div class="p-name">${TYPE_TR[t]}</div>
        <div class="p-val">${val}</div>
      </div>`;
  }).join('');

  const favOnly = el('favOnly').checked;
  const shown = favOnly ? mydex.filter(p => p.favorite) : mydex;

  const area = el('collectionArea');
  if (!mydex.length) {
    area.innerHTML = `
      <div class="empty-box">
        <span class="big-emoji">🎒</span>
        Henüz hiç Pokémon toplamadın!<br>
        Pokédex'e dön, beğendiğin Pokémon'u "⭐ Ekle" butonuyla buraya getir.
      </div>`;
    return;
  }
  if (!shown.length) {
    area.innerHTML = `<div class="empty-box">⭐ Henüz favori işaretlediğin bir Pokémon yok.</div>`;
    return;
  }

  area.innerHTML = `<div class="mydex-grid">${shown.map(p => `
    <div class="mydex-item" data-name="${p.name}">
      ${p.favorite ? '<span class="fav-mark">❤️</span>' : ''}
      <span class="remove-x" data-remove="${p.id}">✕</span>
      <img src="${p.img}" alt="${p.name}">
      <span class="m-name">${p.name}</span>
      ${p.nickname ? `<span class="m-nick">"${p.nickname}"</span>` : ''}
      <div class="m-types">${(p.types || []).map(t =>
        `<span class="m-type-dot" style="background:${TYPE_COLORS[t]}">${TYPE_TR[t] || t}</span>`
      ).join('')}</div>
      <div class="m-power">💪 ${p.power || 0}</div>
    </div>`).join('')}</div>`;

  area.querySelectorAll('.mydex-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.dataset.remove) return;
      window.location.href = `index.html?poke=${item.dataset.name}`;
    });
  });
  area.querySelectorAll('[data-remove]').forEach(x => {
    x.addEventListener('click', (e) => {
      e.stopPropagation();
      const updated = getMyDexShared().filter(p => p.id !== Number(x.dataset.remove));
      saveMyDexShared(updated);
      renderDashboard();
    });
  });
}

el('favOnly').addEventListener('change', renderDashboard);

waitForCloud().then(renderDashboard);
onCloudChange(renderDashboard);
</script>

</body>
</html>
